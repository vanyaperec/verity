<!DOCTYPE html>
<html lang="ru" id="htmlLang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity AI — Финальный комбайн</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --chat-bg: rgba(0, 0, 0, 0.3);
            --header-bg: linear-gradient(135deg, #0d0d2b, #1a1a4e);
            --border: rgba(0, 200, 255, 0.15);
            --text: #e0f0ff;
            --subtext: #88bbdd;
            --user-msg: linear-gradient(135deg, #0077ff, #0055cc);
            --bot-msg-bg: rgba(255, 255, 255, 0.06);
            --bot-msg-border: rgba(0, 200, 255, 0.15);
            --btn-border: rgba(0, 200, 255, 0.2);
            --btn-bg: rgba(0, 200, 255, 0.05);
            --btn-hover: rgba(0, 200, 255, 0.15);
            --input-border: rgba(0, 200, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.04);
            --send-btn: linear-gradient(135deg, #00ccff, #0077ff);
            --canvas-z: -1;
        }

        .theme-acid { --bg: #1a001a; --chat-bg: rgba(255, 0, 255, 0.1); --header-bg: linear-gradient(135deg, #2a002a, #4a004a); --border: rgba(255, 0, 255, 0.3); --text: #ffaaff; --subtext: #cc77cc; --user-msg: linear-gradient(135deg, #ff00ff, #aa00aa); --bot-msg-bg: rgba(255, 0, 255, 0.05); --bot-msg-border: rgba(255, 0, 255, 0.3); --btn-border: rgba(255, 0, 255, 0.3); --btn-bg: rgba(255, 0, 255, 0.1); --btn-hover: rgba(255, 0, 255, 0.25); --input-border: rgba(255, 0, 255, 0.3); --input-bg: rgba(0, 0, 0, 0.2); --send-btn: linear-gradient(135deg, #ff00ff, #aa00aa); }
        .theme-orange { --bg: #1a0f00; --chat-bg: rgba(255, 100, 0, 0.1); --header-bg: linear-gradient(135deg, #2a1a00, #4a2a00); --border: rgba(255, 100, 0, 0.3); --text: #ffcc88; --subtext: #cc9944; --user-msg: linear-gradient(135deg, #ff8800, #cc5500); --bot-msg-bg: rgba(255, 100, 0, 0.05); --bot-msg-border: rgba(255, 100, 0, 0.3); --btn-border: rgba(255, 100, 0, 0.3); --btn-bg: rgba(255, 100, 0, 0.1); --btn-hover: rgba(255, 100, 0, 0.25); --input-border: rgba(255, 100, 0, 0.3); --input-bg: rgba(0, 0, 0, 0.2); --send-btn: linear-gradient(135deg, #ff8800, #cc5500); }
        .theme-forest { --bg: #001a0a; --chat-bg: rgba(0, 255, 100, 0.1); --header-bg: linear-gradient(135deg, #002a1a, #004a2a); --border: rgba(0, 255, 100, 0.3); --text: #88ffcc; --subtext: #44cc88; --user-msg: linear-gradient(135deg, #00ff88, #00cc55); --bot-msg-bg: rgba(0, 255, 100, 0.05); --bot-msg-border: rgba(0, 255, 100, 0.3); --btn-border: rgba(0, 255, 100, 0.3); --btn-bg: rgba(0, 255, 100, 0.1); --btn-hover: rgba(0, 255, 100, 0.25); --input-border: rgba(0, 255, 100, 0.3); --input-bg: rgba(0, 0, 0, 0.2); --send-btn: linear-gradient(135deg, #00ff88, #00cc55); }
        .light-theme { --bg: #f0f4f8; --chat-bg: rgba(255, 255, 255, 0.7); --header-bg: linear-gradient(135deg, #ffffff, #e0e8f0); --border: rgba(0, 0, 0, 0.15); --text: #1a1a2e; --subtext: #445566; --user-msg: linear-gradient(135deg, #0077ff, #0055cc); --bot-msg-bg: rgba(0, 0, 0, 0.04); --bot-msg-border: rgba(0, 0, 0, 0.1); --btn-border: rgba(0, 0, 0, 0.2); --btn-bg: rgba(0, 0, 0, 0.04); --btn-hover: rgba(0, 0, 0, 0.1); --input-border: rgba(0, 0, 0, 0.2); --input-bg: #ffffff; --send-btn: linear-gradient(135deg, #0077ff, #0055cc); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: background 0.4s; }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--canvas-z); pointer-events: none; opacity: 0.4; }
        .chat-container { width: 100%; max-width: 700px; background: var(--chat-bg); border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; height: 90vh; max-height: 750px; backdrop-filter: blur(6px); z-index: 10; position: relative; }
        .header { background: var(--header-bg); padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #0077ff); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #fff; box-shadow: 0 0 20px rgba(0, 200, 255, 0.3); cursor: pointer; }
        .header .info { flex: 1; }
        .header .info h1 { font-size: 20px; color: var(--text); font-weight: 600; }
        .header .info p { font-size: 13px; color: var(--subtext); }
        .status { font-size: 12px; color: #66dd88; padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(0,255,100,0.2); background: rgba(0,255,100,0.12); }
        .header-controls { display: flex; align-items: center; gap: 6px; }
        .theme-toggle, .lang-toggle { font-size: 18px; cursor: pointer; background: none; border: none; color: var(--text); padding: 4px 6px; border-radius: 8px; transition: 0.2s; }
        .theme-toggle:hover, .lang-toggle:hover { background: var(--btn-bg); }

        .chat-box { flex: 1; padding: 20px 24px; overflow-y: auto; background: rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.3); border-radius: 10px; }
        
        .message { padding: 12px 18px; border-radius: 16px; max-width: 85%; word-wrap: break-word; line-height: 1.5; font-size: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
        .message.bot { align-self: flex-start; background: var(--bot-msg-bg); color: var(--text); border: 1px solid var(--bot-msg-border); border-bottom-left-radius: 4px; }
        .message.bot .bot-name { font-size: 12px; color: #66ccff; font-weight: 600; margin-bottom: 4px; display: block; }
        .message .time { font-size: 10px; opacity: 0.4; margin-top: 6px; display: block; text-align: right; }

        .input-area { padding: 16px 20px; background: rgba(0, 0, 0, 0.2); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
        .input-area input { flex: 1; padding: 12px 18px; border: 2px solid var(--input-border); border-radius: 30px; background: var(--input-bg); color: var(--text); font-size: 15px; outline: none; transition: 0.3s; min-width: 140px; }
        .input-area input:focus { border-color: #00ccff; box-shadow: 0 0 20px rgba(0,200,255,0.1); }
        .input-area input::placeholder { color: var(--subtext); }
        .input-area button { padding: 12px 28px; border: none; border-radius: 30px; background: var(--send-btn); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .input-area button:hover { transform: scale(1.02); box-shadow: 0 6px 25px rgba(0,200,255,0.35); }

        .quick-commands { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px 16px 20px; background: rgba(0, 0, 0, 0.1); border-top: 1px solid var(--border); justify-content: center; flex-shrink: 0; }
        .quick-commands button { padding: 6px 16px; border: 1px solid var(--btn-border); border-radius: 20px; background: var(--btn-bg); color: var(--subtext); font-size: 12px; cursor: pointer; transition: 0.3s; }
        .quick-commands button:hover { background: var(--btn-hover); border-color: #00ccff; color: var(--text); transform: translateY(-1px); }

        @media (max-width: 500px) {
            .chat-container { height: 95vh; max-height: none; border-radius: 16px; }
            .chat-box { padding: 14px 16px; }
            .message { max-width: 92%; font-size: 14px; padding: 10px 14px; }
            .quick-commands { gap: 5px; padding: 6px 12px 12px 12px; }
            .quick-commands button { padding: 4px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="chat-container">
        <div class="header">
            <div class="avatar" id="avatarBtn" onclick="triggerEasterEgg()">V</div>
            <div class="info"><h1 id="uiTitle">Verity AI</h1><p id="uiSubtitle">Твой ИИ-помощник</p></div>
            <div class="status">● <span id="uiStatus">онлайн</span></div>
            <div class="header-controls">
                <button class="lang-toggle" onclick="toggleLang()" id="langBtn">RU</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            </div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="quick-commands">
            <button onclick="sendCommand('привет')" id="cmdHi">👋 Привет</button>
            <button onclick="sendCommand('погода москва')" id="cmdWeather">🌤 Погода</button>
            <button onclick="sendCommand('игры')" id="cmdGames">🎮 Игры</button>
            <button onclick="sendCommand('пароль 12')" id="cmdPwd">🔑 Пароль</button>
            <button onclick="sendCommand('курс usd')" id="cmdCurr">💵 Курс</button>
            <button onclick="sendCommand('заметки')" id="cmdNotes">📒 Заметки</button>
            <button onclick="sendCommand('калории')" id="cmdCalories">📊 Калории</button>
            <button onclick="sendCommand('монетка')" id="cmdCoin">🪙 Монетка</button>
            <button onclick="sendCommand('список')" id="cmdList">📋 Список</button>
            <button onclick="sendCommand('очистить')" id="cmdClear">🗑 Очистить</button>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Напиши что-нибудь..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">➤ <span id="btnSend">Отправить</span></button>
        </div>
    </div>

    <script>
        // ==========================================================
        //  ЯДРО
        // ==========================================================
        const chatBox = document.getElementById('chatBox');
        let memory = JSON.parse(localStorage.getItem('verityMemory')) || {};
        let notes = JSON.parse(localStorage.getItem('verityNotes')) || [];
        let tasks = JSON.parse(localStorage.getItem('verityTasks')) || [];
        let stats = JSON.parse(localStorage.getItem('verityStats')) || {};
        let chatLog = JSON.parse(localStorage.getItem('verityChatLog')) || [];
        let userName = localStorage.getItem('verityUserName') || 'Ты';
        let gameMode = null;
        let gameData = {};
        let eggCount = 0;
        let currentLang = localStorage.getItem('verityLang') || 'ru';
        let timers = {};
        let reminders = JSON.parse(localStorage.getItem('verityReminders')) || [];
        let shoppingList = JSON.parse(localStorage.getItem('verityShoppingList')) || [];

        // --- Переводы ---
        const LANG = {
            ru: {
                hi: 'Привет, {name}! Как дела?', sub: 'Твой ИИ-помощник', status: 'онлайн', send: 'Отправить',
                cmdHi: '👋 Привет', cmdGames: '🎮 Игры', cmdClear: '🗑 Очистить',
                placeholder: 'Напиши что-нибудь...', title: 'Verity AI',
                unknown: '🤔 Не понимаю. Попробуй "помощь" или научи меня "запомни вопрос = ответ".',
                exit: '🚪 Пока! Страница заблокирована.',
                forget: '🧹 Я всё забыл. Мой разум чист.',
                export_done: '📥 История скачана!',
                theme_sw: '🎨 Тема переключена!',
                games_menu: '🎮 **Меню игр:**\n1. Угадай число (guess)\n2. Камень-ножницы-бумага (rps)\n3. Викторина (trivia)\n4. Крестики-нолики (tictactoe)\n5. Быки и коровы (bulls)\n6. Сапёр 5x5 (sapper)\n\nВведи название игры или выбери цифру.',
                guess_start: '🎲 Я загадал число от 1 до 100. Попробуй угадать!',
                rps_start: '✊ Камень, ножницы или бумага? Введи: камень, ножницы, бумага',
                trivia_start: '🎯 Викторина! Отвечай буквой a/b/c или "выход".',
                win: '🏆 Ты выиграл!',
                lose: '💻 Я выиграл!',
                draw: 'Ничья!',
                boom: '💥 Ты наступил на мину! Конец игры.',
                ach_menu: '🏆 **Твои достижения:**\n'
            },
            en: {
                hi: 'Hello, {name}! How are you?', sub: 'Your AI assistant', status: 'online', send: 'Send',
                cmdHi: '👋 Hello', cmdGames: '🎮 Games', cmdClear: '🗑 Clear',
                placeholder: 'Type something...', title: 'Verity AI',
                unknown: '🤔 I don\'t understand. Try "help" or teach me "remember question = answer".',
                exit: '🚪 Bye! Page locked.',
                forget: '🧹 I forgot everything. My mind is clean.',
                export_done: '📥 History downloaded!',
                theme_sw: '🎨 Theme toggled!',
                games_menu: '🎮 **Game Menu:**\n1. Guess Number (guess)\n2. Rock-Paper-Scissors (rps)\n3. Trivia (trivia)\n4. Tic-Tac-Toe (tictactoe)\n5. Bulls and Cows (bulls)\n6. Minesweeper 5x5 (sapper)\n\nEnter game name or number.',
                guess_start: '🎲 I guessed a number from 1 to 100. Try to guess!',
                rps_start: '✊ Rock, paper or scissors? Enter: rock, paper, scissors',
                trivia_start: '🎯 Trivia! Answer with a/b/c or "exit".',
                win: '🏆 You won!',
                lose: '💻 I won!',
                draw: 'Draw!',
                boom: '💥 You stepped on a mine! Game over.',
                ach_menu: '🏆 **Your achievements:**\n'
            }
        };

        function t(key, name) {
            let str = LANG[currentLang][key] || LANG['ru'][key];
            if (name && str.includes('{name}')) str = str.replace('{name}', name);
            return str;
        }

        function addMessage(sender, text, isSystem = false) {
            const div = document.createElement('div');
            if (isSystem) { div.className = 'message bot'; div.style.alignSelf = 'center'; div.style.fontSize = '0.8em'; div.style.opacity = '0.6'; div.style.textAlign = 'center'; }
            else { div.className = sender === 'user' ? 'message user' : 'message bot'; }
            if (sender === 'user' || isSystem) { div.innerHTML = text + '<span class="time">' + getTime() + '</span>'; }
            else {
                div.innerHTML = '<span class="bot-name">🤖 Verity</span>' + 
                    '<span class="typing-text">' + text + '</span>' +
                    '<span class="time">' + getTime() + '</span>';
                chatBox.appendChild(div);
                typeWriterEffect(div.querySelector('.typing-text'), text);
                return;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getTime() { const n = new Date(); return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0'); }

        function typeWriterEffect(el, text) {
            el.textContent = '';
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) { el.textContent += text.charAt(i); i++; }
                else { clearInterval(interval); }
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 20);
        }

        function playClick() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = 800; gain.gain.value = 0.1;
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function playBoom() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.value = 150;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function addStat(game) {
            if (!stats[game]) stats[game] = 0;
            stats[game]++;
            localStorage.setItem('verityStats', JSON.stringify(stats));
        }

        function launchConfetti() {
            const canvas = document.createElement('canvas');
            canvas.id = 'confettiCanvas';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let particles = [];
            const colors = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0', '#00f', '#ffa500'];
            for (let i=0; i<150; i++) {
                particles.push({
                    x: Math.random()*canvas.width,
                    y: Math.random()*canvas.height - canvas.height,
                    w: Math.random()*8+4, h: Math.random()*8+4,
                    vx: (Math.random()-0.5)*6, vy: Math.random()*6+4,
                    color: colors[Math.floor(Math.random()*colors.length)],
                    rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*10
                });
            }
            let frame = 0;
            const interval = setInterval(() => {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.rot += p.rotSpeed;
                    if (p.y < canvas.height + 50) { alive = true; }
                    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
                    ctx.restore();
                });
                frame++;
                if (!alive || frame > 200) { clearInterval(interval); canvas.remove(); }
            }, 30);
        }

        // ==========================================================
        //  ОТПРАВКА И КОМАНДЫ
        // ==========================================================
        function sendMessage() {
            const input = document.getElementById('userInput');
            let text = input.value.trim();
            if (!text) return;
            playClick();
            addMessage('user', text);
            input.value = '';
            chatLog.push({sender: 'user', text: text, time: getTime()});
            localStorage.setItem('verityChatLog', JSON.stringify(chatLog));
            processCommand(text);
        }
        function sendCommand(cmd) { document.getElementById('userInput').value = cmd; sendMessage(); }

        function processCommand(text) {
            const lower = text.toLowerCase().trim();

            // --- Игровые режимы ---
            if (gameMode) {
                if (lower === 'выход' || lower === 'exit') { gameMode = null; addMessage('bot', '🚪 Игра завершена.'); return; }
                if (gameMode === 'guess') { processGuess(text); return; }
                if (gameMode === 'trivia') { processTrivia(text); return; }
                if (gameMode === 'rps') { processRPS(text); return; }
                if (gameMode === 'tictactoe') { processTicTacToe(text); return; }
                if (gameMode === 'bulls') { processBulls(text); return; }
                if (gameMode === 'sapper') { processSapper(text); return; }
            }

            // --- Выход ---
            if (lower === 'выход' || lower === 'exit') {
                addMessage('bot', t('exit'));
                document.getElementById('userInput').disabled = true;
                document.querySelector('.input-area button').disabled = true;
                return;
            }

            // --- Запомни (свои команды) ---
            if (lower.startsWith('запомни') || lower.startsWith('remember')) {
                const parts = text.split('=');
                if (parts.length===2) {
                    const q = parts[0].replace(/запомни|remember|:/gi,'').trim();
                    const a = parts[1].trim();
                    memory[q] = a;
                    localStorage.setItem('verityMemory', JSON.stringify(memory));
                    addMessage('bot', '🧠 Запомнил: "'+q+'" -> "'+a+'"');
                } else addMessage('bot', '❌ Используй: запомни вопрос = ответ');
                return;
            }

            // --- Имя ---
            if (lower.startsWith('меня зовут') || lower.startsWith('my name is')) {
                userName = text.replace(/меня зовут|my name is/i,'').trim();
                localStorage.setItem('verityUserName', userName);
                addMessage('bot', '👋 Приятно познакомиться, '+userName+'!');
                return;
            }

            // --- Очистка памяти ---
            if (lower === 'забудь всё' || lower === 'forget all' || lower === 'забудь') {
                localStorage.removeItem('verityMemory');
                localStorage.removeItem('verityUserName');
                localStorage.removeItem('verityChatLog');
                memory = {};
                userName = 'Ты';
                chatLog = [];
                chatBox.innerHTML = '';
                addMessage('bot', t('forget'));
                return;
            }

            // --- Экспорт чата ---
            if (lower === 'скачать' || lower === 'download' || lower === 'export') {
                let content = '=== История чата Verity ===\n';
                chatLog.forEach(m => { content += '['+m.time+'] '+m.sender+': '+m.text+'\n'; });
                const blob = new Blob([content], {type: 'text/plain'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'verity_chat.txt';
                a.click(); URL.revokeObjectURL(a.href);
                addMessage('bot', t('export_done'));
                return;
            }

            // --- Достижения ---
            if (lower === 'достижения' || lower === 'achievements' || lower === 'ach') {
                let ach = JSON.parse(localStorage.getItem('verityAchievements')) || {};
                let msg = t('ach_menu');
                let has = false;
                for (let key in ach) { if (ach[key]) { msg += '✔️ ' + key + ': ' + ach[key] + '\n'; has = true; } }
                if (!has) msg += '😴 Пока нет достижений. Играй в игры!';
                addMessage('bot', msg);
                return;
            }

            // --- Статистика игр ---
            if (lower === 'статистика' || lower === 'stats') {
                let msg = '📊 **Статистика побед:**\n';
                let has = false;
                for (let g in stats) { msg += '🎮 ' + g + ': ' + stats[g] + ' побед\n'; has = true; }
                if (!has) msg += '😴 Пока нет статистики. Выигрывай в игры!';
                addMessage('bot', msg);
                return;
            }

            // --- Игры ---
            if (lower === 'игры' || lower === 'games') {
                addMessage('bot', t('games_menu'));
                return;
            }
            if (lower === '1' || lower === 'guess') { gameMode = 'guess'; gameData = {}; addMessage('bot', t('guess_start')); return; }
            if (lower === '2' || lower === 'rps') { gameMode = 'rps'; addMessage('bot', t('rps_start')); return; }
            if (lower === '3' || lower === 'trivia') { startTrivia(); return; }
            if (lower === '4' || lower === 'tictactoe') { startTicTacToe(); return; }
            if (lower === '5' || lower === 'bulls') { startBulls(); return; }
            if (lower === '6' || lower === 'sapper') { startSapper(); return; }

            // --- Погода ---
            if (lower.startsWith('погода') || lower.startsWith('weather')) {
                let city = text.replace(/погода|weather/i, '').trim();
                if (!city) {
                    if (memory['мой город'] || memory['my city']) {
                        city = memory['мой город'] || memory['my city'];
                    } else {
                        addMessage('bot', '🌍 Укажи город: напиши "погода Москва" или запомни город через "запомни мой город = Москва"');
                        return;
                    }
                }
                addMessage('bot', `🌤 Запрашиваю погоду для ${city}...`);
                fetch(`https://wttr.in/${encodeURIComponent(city)}?format=%C+%t+%w+%h&m&lang=ru`)
                    .then(res => {
                        if (!res.ok) throw new Error('Ошибка сети');
                        return res.text();
                    })
                    .then(data => {
                        if (data.includes('<html') || data.includes('<')) {
                            let tempMatch = data.match(/([-+]?\d+)\s*°C/);
                            let windMatch = data.match(/(\d+)\s*км\/ч/);
                            let humidMatch = data.match(/(\d+)\s*%/);
                            let descMatch = data.match(/(?!DOCTYPE)([А-Яа-яA-Za-z]+)/);
                            let result = `🌤 ${city}: `;
                            if (descMatch) result += descMatch[0] + ', ';
                            if (tempMatch) result += tempMatch[0] + ', ';
                            if (windMatch) result += 'ветер ' + windMatch[0] + ', ';
                            if (humidMatch) result += 'влажность ' + humidMatch[0];
                            if (result === `🌤 ${city}: `) result += 'данные не распознаны.';
                            addMessage('bot', result);
                        } else {
                            addMessage('bot', `🌤 Погода в ${city}: ${data}`);
                        }
                    })
                    .catch(() => {
                        addMessage('bot', '❌ Не удалось получить погоду. Проверь город или попробуй позже.');
                    });
                return;
            }

            // --- Курс валют ---
            if (lower.startsWith('курс') || lower.startsWith('rate')) {
                let currency = text.replace(/курс|rate/i, '').trim().toUpperCase();
                if (!currency) currency = 'USD';
                addMessage('bot', `💵 Запрашиваю курс ${currency} к RUB...`);
                fetch(`https://api.exchangerate-api.com/v4/latest/${currency}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.rates && data.rates.RUB) {
                            addMessage('bot', `💵 1 ${currency} = ${data.rates.RUB} RUB`);
                        } else {
                            addMessage('bot', '❌ Не удалось получить курс. Проверь валюту (USD, EUR, GBP).');
                        }
                    })
                    .catch(() => {
                        addMessage('bot', '❌ Ошибка получения курса валют.');
                    });
                return;
            }

            // --- Конвертер валют ---
            if (lower.startsWith('конверт')) {
                let parts = text.replace(/конверт/i, '').trim().split(' ');
                let amount = parseFloat(parts[0]);
                let from = parts[1] ? parts[1].toUpperCase() : 'USD';
                let to = parts[3] ? parts[3].toUpperCase() : 'RUB';
                if (isNaN(amount) || amount <= 0) { addMessage('bot', '📉 Пример: конверт 100 usd в rub'); return; }
                addMessage('bot', `🔄 Конвертирую ${amount} ${from} в ${to}...`);
                fetch(`https://api.exchangerate-api.com/v4/latest/${from}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.rates && data.rates[to]) {
                            let result = amount * data.rates[to];
                            addMessage('bot', `💱 ${amount} ${from} = ${result.toFixed(2)} ${to}`);
                        } else {
                            addMessage('bot', '❌ Не удалось конвертировать. Проверь валюты.');
                        }
                    })
                    .catch(() => {
                        addMessage('bot', '❌ Ошибка конвертации.');
                    });
                return;
            }

            // --- Конвертер единиц (без API) ---
            if (lower.startsWith('конверт')) {
                let parts = text.replace(/конверт/i, '').trim().split(' ');
                if (parts.length < 4) { addMessage('bot', '📐 Пример: конверт 10 км в мили'); return; }
                let value = parseFloat(parts[0]);
                let from = parts[1].toLowerCase();
                let to = parts[3].toLowerCase();
                if (isNaN(value)) { addMessage('bot', '📐 Введи число. Пример: конверт 10 км в мили'); return; }
                let result = 0;
                let unitMap = {
                    'км': { 'мили': 0.621371, 'м': 1000 },
                    'мили': { 'км': 1.60934, 'м': 1609.34 },
                    'м': { 'км': 0.001, 'мили': 0.000621371 },
                    'кг': { 'фунты': 2.20462 },
                    'фунты': { 'кг': 0.453592 },
                    'c': { 'f': (value * 9/5) + 32 },
                    'f': { 'c': (value - 32) * 5/9 }
                };
                if (unitMap[from] && unitMap[from][to]) {
                    if (typeof unitMap[from][to] === 'function') {
                        result = unitMap[from][to]();
                    } else {
                        result = value * unitMap[from][to];
                    }
                    addMessage('bot', `📐 ${value} ${from} = ${result.toFixed(2)} ${to}`);
                } else {
                    addMessage('bot', '📐 Поддерживаются: км, мили, м, кг, фунты, C, F');
                }
                return;
            }

            // --- Генератор паролей ---
            if (lower.startsWith('пароль') || lower.startsWith('password')) {
                let len = parseInt(text.replace(/пароль|password/i, '').trim()) || 12;
                if (len < 4) len = 4; if (len > 32) len = 32;
                const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=';
                let pwd = '';
                for (let i=0; i<len; i++) pwd += chars[Math.floor(Math.random()*chars.length)];
                addMessage('bot', `🔑 Сгенерированный пароль (${len} символов):\n\`${pwd}\``);
                return;
            }

            // --- Случайный цвет ---
            if (lower === 'цвет' || lower === 'color') {
                const hex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                addMessage('bot', `🎨 Случайный цвет: ${hex}`);
                return;
            }

            // --- Рандомный фон ---
            if (lower === 'случайный фон' || lower === 'random bg') {
                document.body.style.background = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                addMessage('bot', '🎨 Фон изменён!');
                return;
            }

            // --- Таймер ---
            if (lower.startsWith('таймер') || lower.startsWith('timer')) {
                let sec = parseInt(text.replace(/таймер|timer/i, '').trim());
                if (isNaN(sec) || sec < 1) { addMessage('bot', '⏱️ Укажи время в секундах (например: таймер 10)'); return; }
                if (sec > 3600) { addMessage('bot', '⏱️ Максимум 1 час.'); return; }
                addMessage('bot', `⏱️ Таймер запущен на ${sec} секунд. Я напомню!`);
                setTimeout(() => {
                    addMessage('bot', `⏰ Время вышло! ${sec} секунд прошло.`);
                }, sec * 1000);
                return;
            }

            // --- Калькулятор ---
            if (lower.startsWith('кальк') || lower.startsWith('calc')) {
                let expr = text.replace(/кальк|calc/i, '').trim();
                if (!expr) { addMessage('bot', '🧮 Пример: кальк 2+2'); return; }
                try {
                    let result = eval(expr);
                    addMessage('bot', `🧮 Результат: ${result}`);
                } catch(e) {
                    addMessage('bot', '❌ Ошибка вычисления.');
                }
                return;
            }

            // --- Калькулятор ипотеки ---
            if (lower.startsWith('ипотека') || lower.startsWith('mortgage')) {
                let parts = text.replace(/ипотека|mortgage/i, '').trim().split(' ');
                let amount = parseFloat(parts[0]);
                let years = parseFloat(parts[1]);
                let percent = parseFloat(parts[2]);
                if (isNaN(amount) || isNaN(years) || isNaN(percent)) {
                    addMessage('bot', '🏠 Пример: ипотека 1000000 5 12 (сумма, лет, процент)');
                    return;
                }
                let monthlyRate = percent / 100 / 12;
                let months = years * 12;
                let payment = amount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
                let total = payment * months;
                let overpay = total - amount;
                addMessage('bot', `🏠 **Ипотека:**\n💰 Сумма: ${amount} руб.\n📅 Срок: ${years} лет\n📊 Ставка: ${percent}%\n💳 Ежемесячный платёж: ${payment.toFixed(2)} руб.\n📈 Переплата: ${overpay.toFixed(2)} руб.\n💸 Всего: ${total.toFixed(2)} руб.`);
                return;
            }

            // --- Генератор QR-кода ---
            if (lower.startsWith('qr') || lower.startsWith('qrcode')) {
                let text = text.replace(/qr|qrcode/i, '').trim();
                if (!text) { addMessage('bot', '📱 Пример: qr https://google.com'); return; }
                addMessage('bot', `📱 QR-код для: ${text}\nhttps://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`);
                return;
            }

            // --- Сокращатель ссылок ---
            if (lower.startsWith('сократи') || lower.startsWith('shorten')) {
                let url = text.replace(/сократи|shorten/i, '').trim();
                if (!url) { addMessage('bot', '🔗 Пример: сократи https://google.com'); return; }
                if (!url.startsWith('http')) url = 'https://' + url;
                addMessage('bot', `🔗 Сокращаю ссылку...`);
                fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`)
                    .then(res => res.text())
                    .then(shortUrl => {
                        addMessage('bot', `✅ Сокращённая ссылка: ${shortUrl}`);
                    })
                    .catch(() => {
                        addMessage('bot', '❌ Не удалось сократить ссылку. Попробуй позже.');
                    });
                return;
            }

            // --- Рандом ---
            if (lower === 'рандом' || lower === 'random') {
                let num = Math.floor(Math.random() * 100) + 1;
                addMessage('bot', `🎲 Случайное число от 1 до 100: **${num}**`);
                return;
            }

            // --- История команд ---
            if (lower === 'история' || lower === 'history') {
                if (chatLog.length === 0) { addMessage('bot', '📜 История пуста.'); return; }
                let msg = '📜 **Последние 10 действий:**\n';
                let start = Math.max(0, chatLog.length - 10);
                for (let i = start; i < chatLog.length; i++) {
                    msg += `[${chatLog[i].time}] ${chatLog[i].sender}: ${chatLog[i].text}\n`;
                }
                addMessage('bot', msg);
                return;
            }

            // --- Палитра цветов ---
            if (lower === 'палитра' || lower === 'palette') {
                let colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF', '#FFA500', '#800080'];
                let randomColor = colors[Math.floor(Math.random() * colors.length)];
                addMessage('bot', `🎨 Случайный цвет: ${randomColor}`);
                return;
            }

            // --- Напоминалка ---
            if (lower.startsWith('напомни через')) {
                let parts = text.replace(/напомни через/i, '').trim().split(' ');
                let time = parseInt(parts[0]);
                let unit = parts[1] || 'минут';
                let reminderText = parts.slice(2).join(' ');
                if (isNaN(time) || time <= 0 || !reminderText) {
                    addMessage('bot', '⏰ Пример: напомни через 10 минут позвонить');
                    return;
                }
                let seconds;
                if (unit.includes('секунд') || unit.includes('секунду') || unit.includes('сек')) {
                    seconds = time;
                } else if (unit.includes('час') || unit.includes('часов') || unit.includes('часа')) {
                    seconds = time * 3600;
                } else {
                    seconds = time * 60;
                }
                if (seconds > 86400) { addMessage('bot', '⏰ Максимум 24 часа.'); return; }
                let reminder = { id: Date.now(), text: reminderText, time: seconds, createdAt: Date.now(), active: true };
                reminders.push(reminder);
                localStorage.setItem('verityReminders', JSON.stringify(reminders));
                addMessage('bot', `⏰ Напомню через ${time} ${unit} о: "${reminderText}" (ID: ${reminder.id})`);
                setTimeout(() => {
                    let stillActive = reminders.find(r => r.id === reminder.id && r.active);
                    if (stillActive) {
                        addMessage('bot', `⏰ НАПОМИНАНИЕ: ${reminderText}`);
                        stillActive.active = false;
                        localStorage.setItem('verityReminders', JSON.stringify(reminders));
                    }
                }, seconds * 1000);
                return;
            }

            // --- Список активных напоминаний ---
            if (lower === 'мои напоминания' || lower === 'reminders') {
                let active = reminders.filter(r => r.active);
                if (active.length === 0) {
                    addMessage('bot', '📋 Нет активных напоминаний.');
                    return;
                }
                let msg = '📋 **Активные напоминания:**\n';
                active.forEach((r, i) => {
                    let remaining = Math.floor(r.time / 60);
                    msg += `${i+1}. ${r.text} (через ${remaining} мин.) [ID: ${r.id}]\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // --- Отмена напоминания ---
            if (lower.startsWith('отменить напоминание') || lower.startsWith('cancel reminder')) {
                let id = parseInt(text.replace(/отменить напоминание|cancel reminder/i, '').trim());
                if (isNaN(id)) {
                    addMessage('bot', '❌ Пример: отменить напоминание 123456');
                    return;
                }
                let found = reminders.find(r => r.id === id && r.active);
                if (!found) {
                    addMessage('bot', '❌ Напоминание не найдено или уже выполнено.');
                    return;
                }
                found.active = false;
                localStorage.setItem('verityReminders', JSON.stringify(reminders));
                addMessage('bot', `✅ Напоминание "${found.text}" отменено.`);
                return;
            }

            // --- Калории ---
            if (lower.startsWith('норма') && !isNaN(parseInt(text.replace(/норма/i, '').trim()))) {
                let norm = parseInt(text.replace(/норма/i, '').trim());
                if (norm <= 0) { addMessage('bot', '⚠️ Норма должна быть больше 0.'); return; }
                localStorage.setItem('verityCalorieNorm', JSON.stringify(norm));
                addMessage('bot', `✅ Дневная норма калорий установлена: **${norm}**.`);
                return;
            }
            if (lower.startsWith('калории') || lower.startsWith('calories')) {
                let parts = text.replace(/калории|calories/i, '').trim();
                if (parts === 'неделя' || parts === 'week') {
                    let total = 0;
                    let days = 0;
                    for (let i = 0; i < 7; i++) {
                        let d = new Date();
                        d.setDate(d.getDate() - i);
                        let key = 'verityCalories_' + d.toLocaleDateString();
                        let val = JSON.parse(localStorage.getItem(key)) || 0;
                        total += val;
                        days++;
                    }
                    let avg = Math.round(total / days);
                    addMessage('bot', `📊 Среднее потребление за 7 дней: **${avg}** калорий/день.`);
                    return;
                }
                if (parts === '') {
                    let today = new Date().toLocaleDateString();
                    let todayCal = JSON.parse(localStorage.getItem('verityCalories_' + today)) || 0;
                    let norm = JSON.parse(localStorage.getItem('verityCalorieNorm')) || null;
                    let msg = `📊 Сегодня (${today}) съедено: **${todayCal}** калорий.`;
                    if (norm) {
                        let остаток = norm - todayCal;
                        msg += `\n🎯 Норма: ${norm} | Остаток: **${остаток}** калорий.`;
                    }
                    addMessage('bot', msg);
                    return;
                }
                let cal = parseInt(parts);
                if (isNaN(cal) || cal <= 0) { addMessage('bot', '⚠️ Пример: калории 500'); return; }
                let today = new Date().toLocaleDateString();
                let current = JSON.parse(localStorage.getItem('verityCalories_' + today)) || 0;
                let total = current + cal;
                localStorage.setItem('verityCalories_' + today, JSON.stringify(total));
                addMessage('bot', `✅ Добавлено ${cal} калорий. Итог за сегодня: **${total}**.`);
                return;
            }

            // --- Рулетка ---
            if (lower.startsWith('монеты') && !isNaN(parseInt(text.replace(/монеты|coins/i, '').trim()))) {
                let bal = parseInt(text.replace(/монеты|coins/i, '').trim());
                if (bal < 0) { addMessage('bot', '⚠️ Баланс не может быть отрицательным.'); return; }
                localStorage.setItem('verityBalance', JSON.stringify(bal));
                addMessage('bot', `💰 Баланс установлен: **${bal}** монет.`);
                return;
            }
            if (lower.startsWith('рулетка') || lower.startsWith('roulette')) {
                let args = text.replace(/рулетка|roulette/i, '').trim();
                if (!args) {
                    addMessage('bot', '🎰 Пример: рулетка пицца, суши, бургер');
                    return;
                }
                let parts = args.split(' на ');
                let optionsStr = parts[0];
                let bet = parts.length > 1 ? parseInt(parts[1]) : null;
                let options = optionsStr.split(',').map(s => s.trim());
                if (options.length < 2) { addMessage('bot', '🎰 Нужно хотя бы 2 варианта через запятую.'); return; }
                let winner = options[Math.floor(Math.random() * options.length)];
                if (bet !== null && !isNaN(bet) && bet > 0) {
                    let balance = JSON.parse(localStorage.getItem('verityBalance')) || 0;
                    if (balance < bet) {
                        addMessage('bot', `❌ Недостаточно монет. У тебя: ${balance}, ставка: ${bet}.`);
                        return;
                    }
                    let win = Math.random() > 0.5;
                    if (win) {
                        balance += bet;
                        localStorage.setItem('verityBalance', JSON.stringify(balance));
                        addMessage('bot', `🎰 Варианты: ${args.split(' на ')[0]}\n👉 **Выпало: ${winner}** 🏆\n💰 Ты выиграл! +${bet} монет. Баланс: **${balance}**.`);
                    } else {
                        balance -= bet;
                        localStorage.setItem('verityBalance', JSON.stringify(balance));
                        addMessage('bot', `🎰 Варианты: ${args.split(' на ')[0]}\n👉 **Выпало: ${winner}** 😢\n💸 Ты проиграл ${bet} монет. Баланс: **${balance}**.`);
                    }
                } else {
                    addMessage('bot', `🎰 Из вариантов: ${optionsStr}\n👉 **Выпало: ${winner}**`);
                }
                return;
            }

            // --- Монетка со статистикой ---
            if (lower === 'монетка' || lower === 'coin') {
                let stats = JSON.parse(localStorage.getItem('verityCoinStats')) || { heads: 0, tails: 0 };
                let result = Math.random() < 0.5 ? 'Орёл' : 'Решка';
                if (result === 'Орёл') { stats.heads++; } else { stats.tails++; }
                localStorage.setItem('verityCoinStats', JSON.stringify(stats));
                addMessage('bot', `🪙 **Результат:** ${result}\n📊 **Статистика:**\nОрёл: ${stats.heads}\nРешка: ${stats.tails}`);
                return;
            }

            // --- Список покупок ---
            if (lower === 'список' || lower === 'list') {
                if (shoppingList.length === 0) {
                    addMessage('bot', '📋 Список покупок пуст. Добавь через "купить ..."');
                    return;
                }
                let msg = '📋 **Список покупок:**\n';
                shoppingList.forEach((item, i) => {
                    let status = item.done ? '✅' : '⬜';
                    msg += `${i+1}. ${status} ${item.text}\n`;
                });
                addMessage('bot', msg);
                return;
            }
            if (lower.startsWith('купить') || lower.startsWith('buy')) {
                let item = text.replace(/купить|buy/i, '').trim();
                if (!item) { addMessage('bot', '📋 Пример: купить молоко'); return; }
                shoppingList.push({ text: item, done: false });
                localStorage.setItem('verityShoppingList', JSON.stringify(shoppingList));
                addMessage('bot', `📋 Добавлено: "${item}"`);
                return;
            }
            if (lower.startsWith('купил') || lower.startsWith('bought')) {
                let num = parseInt(text.replace(/купил|bought/i, '').trim());
                if (isNaN(num) || num < 1 || num > shoppingList.length) {
                    addMessage('bot', '⚠️ Пример: купил 1');
                    return;
                }
                shoppingList[num-1].done = true;
                localStorage.setItem('verityShoppingList', JSON.stringify(shoppingList));
                addMessage('bot', `✅ Покупка #${num} отмечена как выполненная.`);
                return;
            }
            if (lower === 'очистить список' || lower === 'clear list') {
                let doneItems = shoppingList.filter(item => !item.done);
                if (doneItems.length === shoppingList.length) {
                    shoppingList = [];
                    localStorage.removeItem('verityShoppingList');
                    addMessage('bot', '🗑️ Список покупок полностью очищен.');
                    return;
                }
                shoppingList = doneItems;
                localStorage.setItem('verityShoppingList', JSON.stringify(shoppingList));
                addMessage('bot', '🗑️ Выполненные покупки удалены. Остались: ' + shoppingList.length + ' шт.');
                return;
            }

            // --- Генератор мемов (Canvas) ---
            if (lower.startsWith('мем') || lower.startsWith('meme')) {
                let raw = text.replace(/мем|meme/i, '').trim();
                let bgColor = '#ffffff';
                let colors = {
                    'красном': '#ff0000', 'синем': '#0000ff', 'зелёном': '#00cc00',
                    'чёрном': '#000000', 'жёлтом': '#ffcc00', 'фиолетовом': '#9900ff',
                    'оранжевом': '#ff8800', 'розовом': '#ff66b2'
                };
                for (let key in colors) {
                    if (raw.includes('на ' + key + ' фоне')) {
                        bgColor = colors[key];
                        raw = raw.replace('на ' + key + ' фоне', '').trim();
                        break;
                    }
                }
                if (!raw) { addMessage('bot', '🖼️ Пример: мем Пойми меня, если сможешь'); return; }
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 600; canvas.height = 400;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, 600, 400);
                    ctx.fillStyle = bgColor === '#ffffff' || bgColor === '#ffff00' ? '#000000' : '#ffffff';
                    ctx.font = 'bold 32px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let words = raw.split(' ');
                    let lines = [];
                    let currentLine = '';
                    for (let w of words) {
                        let test = currentLine + w + ' ';
                        if (ctx.measureText(test).width > 500) { lines.push(currentLine); currentLine = w + ' '; }
                        else { currentLine = test; }
                    }
                    lines.push(currentLine);
                    let startY = 200 - (lines.length * 20);
                    lines.forEach((line, i) => {
                        ctx.fillText(line, 300, startY + i * 40);
                    });
                    const link = document.createElement('a');
                    link.download = 'meme.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    addMessage('bot', '🖼️ Мем сгенерирован! Проверь папку "Загрузки".');
                } catch (e) {
                    addMessage('bot', '❌ Ошибка генерации мема.');
                }
                return;
            }

            // --- Заметки ---
            if (lower === 'заметки' || lower === 'notes') {
                if (notes.length === 0) { addMessage('bot', '📒 Заметок пока нет. Напиши "заметка текст" чтобы добавить.'); return; }
                let msg = '📒 **Список заметок:**\n';
                notes.forEach((n, i) => { msg += `${i+1}. ${n}\n`; });
                addMessage('bot', msg);
                return;
            }
            if (lower.startsWith('заметка') || lower.startsWith('note')) {
                let note = text.replace(/заметка|note/i, '').trim();
                if (!note) { addMessage('bot', '📒 Укажи текст заметки. Пример: заметка купить хлеб'); return; }
                notes.push(note);
                localStorage.setItem('verityNotes', JSON.stringify(notes));
                addMessage('bot', `📒 Заметка сохранена: "${note}"`);
                return;
            }
            if (lower.startsWith('удалить заметку') || lower.startsWith('delete note')) {
                let idx = parseInt(text.replace(/удалить заметку|delete note/i, '').trim());
                if (isNaN(idx) || idx < 1 || idx > notes.length) { addMessage('bot', '⚠️ Укажи номер заметки. Пример: удалить заметку 1'); return; }
                let removed = notes.splice(idx-1, 1);
                localStorage.setItem('verityNotes', JSON.stringify(notes));
                addMessage('bot', `🗑️ Заметка "${removed[0]}" удалена.`);
                return;
            }

            // --- Задачи ---
            if (lower === 'задачи' || lower === 'tasks') {
                if (tasks.length === 0) { addMessage('bot', '📋 Задач пока нет. Добавь через "задача текст"'); return; }
                let msg = '📋 **Список задач:**\n';
                tasks.forEach((t, i) => { msg += `${i+1}. ${t.text} [${t.done ? '✅' : '⬜'}]\n`; });
                addMessage('bot', msg);
                return;
            }
            if (lower.startsWith('задача') || lower.startsWith('task')) {
                let taskText = text.replace(/задача|task/i, '').trim();
                if (!taskText) { addMessage('bot', '📋 Укажи текст задачи. Пример: задача купить хлеб'); return; }
                tasks.push({text: taskText, done: false});
                localStorage.setItem('verityTasks', JSON.stringify(tasks));
                addMessage('bot', `📋 Задача добавлена: "${taskText}"`);
                return;
            }
            if (lower.startsWith('выполнить') || lower.startsWith('done')) {
                let idx = parseInt(text.replace(/выполнить|done/i, '').trim());
                if (isNaN(idx) || idx < 1 || idx > tasks.length) { addMessage('bot', '⚠️ Укажи номер задачи. Пример: выполнить 1'); return; }
                tasks[idx-1].done = true;
                localStorage.setItem('verityTasks', JSON.stringify(tasks));
                addMessage('bot', `✅ Задача #${idx} выполнена!`);
                return;
            }

            // --- Очистка чата ---
            if (lower === 'очистить' || lower === 'clear') {
                chatBox.innerHTML = '';
                addMessage('bot', '🧹 Чат очищен.');
                return;
            }

            // --- Конфетти (пасхалка) ---
            if (lower === 'я гений' || lower === 'i am genius') {
                launchConfetti();
                addMessage('bot', '🎉 Ты гений! Смотри, как летают конфетти!');
                return;
            }

            // --- Секретный код ---
            if (lower === 'консоль' || lower === 'console') {
                console.log('🔥 Ты нашёл меня! Verity внутри.');
                addMessage('bot', '🕵️ Секретный код активирован! Смотри в консоль (F12).');
                return;
            }

            // --- Озвучивание ---
            if (lower === 'озвучить' || lower === 'speak') {
                const msg = currentLang === 'ru' ? 'Привет, я Верути. Я могу говорить голосом.' : 'Hello, I am Verity. I can speak.';
                speakText(msg);
                addMessage('bot', '🔊 Говорю: "'+msg+'"');
                return;
            }

            // --- Смена темы ---
            if (lower === 'тема кислотная' || lower === 'theme acid') { document.body.className = 'theme-acid'; localStorage.setItem('verityTheme', 'acid'); addMessage('bot', '🎨 Тема: Кислотная! 💜'); return; }
            if (lower === 'тема оранжевая' || lower === 'theme orange') { document.body.className = 'theme-orange'; localStorage.setItem('verityTheme', 'orange'); addMessage('bot', '🎨 Тема: Оранжевая! 🧡'); return; }
            if (lower === 'тема лесная' || lower === 'theme forest') { document.body.className = 'theme-forest'; localStorage.setItem('verityTheme', 'forest'); addMessage('bot', '🎨 Тема: Лесная! 🌿'); return; }
            if (lower === 'тема' || lower === 'theme') { toggleTheme(); addMessage('bot', t('theme_sw')); return; }

            // --- Проверка памяти ---
            if (memory[text]) { addMessage('bot', memory[text]); return; }

            // --- Базовые ответы ---
            if (lower === 'привет' || lower === 'hi' || lower === 'hello') {
                let nameToShow = userName.trim() === '' ? 'друг' : userName.trim();
                addMessage('bot', t('hi', nameToShow));
            }
            else if (lower === 'шутка' || lower === 'joke') addMessage('bot', jokes[Math.floor(Math.random()*jokes.length)]);
            else if (lower === 'факт' || lower === 'fact') addMessage('bot', facts[Math.floor(Math.random()*facts.length)]);
            else if (lower === 'совет' || lower === 'advice') addMessage('bot', advices[Math.floor(Math.random()*advices.length)]);
            else if (lower === 'цитата' || lower === 'quote') addMessage('bot', quotes[Math.floor(Math.random()*quotes.length)]);
            else addMessage('bot', t('unknown'));
        }

        // ==========================================================
        //  ИГРЫ
        // ==========================================================
        function addAchievement(name) {
            let ach = JSON.parse(localStorage.getItem('verityAchievements')) || {};
            if (!ach[name]) ach[name] = 1; else ach[name]++;
            localStorage.setItem('verityAchievements', JSON.stringify(ach));
        }

        function startTrivia() {
            gameMode = 'trivia';
            gameData = { score: 0, qIndex: 0 };
            gameData.questions = [
                { q: 'Столица Франции?', o: ['a) Лондон', 'b) Париж', 'c) Берлин'], a: 'b' },
                { q: '2+2?', o: ['a) 3', 'b) 4', 'c) 5'], a: 'b' },
                { q: 'Самая большая планета?', o: ['a) Земля', 'b) Юпитер', 'c) Сатурн'], a: 'b' },
                { q: 'Кто написал "Война и мир"?', o: ['a) Пушкин', 'b) Толстой', 'c) Достоевский'], a: 'b' }
            ];
            addMessage('bot', t('trivia_start'));
            setTimeout(() => showTriviaQ(), 500);
        }
        function showTriviaQ() {
            if (gameData.qIndex >= gameData.questions.length) {
                addStat('Викторина'); addAchievement('Викторина');
                const r = gameData.score + ' из ' + gameData.questions.length;
                addMessage('bot', '🏆 Викторина окончена! Счёт: '+r);
                gameMode = null; return;
            }
            const q = gameData.questions[gameData.qIndex];
            addMessage('bot', '📌 Вопрос '+(gameData.qIndex+1)+': '+q.q+'<br>'+q.o.join('<br>'));
        }
        function processTrivia(text) {
            const q = gameData.questions[gameData.qIndex];
            if (text.toLowerCase() === q.a) { gameData.score++; addMessage('bot', '✅ Верно!'); }
            else addMessage('bot', '❌ Неверно. Ответ: '+q.a.toUpperCase());
            gameData.qIndex++;
            setTimeout(showTriviaQ, 600);
        }

        function processGuess(text) {
            if (!gameData.target) { gameData.target = Math.floor(Math.random()*100)+1; gameData.attempts=0; }
            const g = parseInt(text);
            if (isNaN(g)) { addMessage('bot', '⚠️ Введи число!'); return; }
            gameData.attempts++;
            if (g < gameData.target) addMessage('bot', '📈 Мало!');
            else if (g > gameData.target) addMessage('bot', '📉 Много!');
            else { addStat('Угадай число'); addAchievement('Угадай число'); addMessage('bot', '🎉 Угадал за '+gameData.attempts+' попыток!'); gameMode=null; }
        }

        function processRPS(text) {
            const choices = ['камень','ножницы','бумага'];
            const ai = choices[Math.floor(Math.random()*3)];
            if (!choices.includes(text.toLowerCase())) { addMessage('bot', '⚠️ Выбери: камень, ножницы или бумага'); return; }
            let res = 'Я выбрал: '+ai+'. ';
            if (text.toLowerCase() === ai) res += t('draw');
            else if ((text.toLowerCase()==='камень'&&ai==='ножницы')||(text.toLowerCase()==='ножницы'&&ai==='бумага')||(text.toLowerCase()==='бумага'&&ai==='камень')) res += t('win');
            else res += t('lose');
            addMessage('bot', res);
            gameMode = null;
        }

        function startTicTacToe() {
            gameMode = 'tictactoe';
            gameData = { board: [' ',' ',' ',' ',' ',' ',' ',' ',' '], turn: 'X' };
            addMessage('bot', '⭕ Крестики-нолики. Ты X, я O. Введи номер клетки (1-9).');
            renderTicTacToe();
        }
        function renderTicTacToe() {
            const b = gameData.board; let s = '';
            for (let i=0; i<9; i++) { s += (i%3===0?'\n':'') + (b[i]===' '?i+1:b[i]) + ' '; }
            addMessage('bot', '```\n'+s+'\n```');
        }
        function processTicTacToe(text) {
            const idx = parseInt(text)-1;
            if (isNaN(idx) || idx<0 || idx>8 || gameData.board[idx]!==' ') { addMessage('bot', '⚠️ Неверный ход!'); return; }
            gameData.board[idx] = 'X';
            if (checkWin(gameData.board, 'X')) { addStat('Крестики-нолики'); addAchievement('Крестики-нолики'); addMessage('bot', t('win')); gameMode=null; return; }
            let empty = gameData.board.map((v,i)=>v===' '?i:null).filter(v=>v!==null);
            if (empty.length===0) { addMessage('bot', t('draw')); gameMode=null; return; }
            let move = empty[Math.floor(Math.random()*empty.length)];
            gameData.board[move] = 'O';
            if (checkWin(gameData.board, 'O')) { addMessage('bot', t('lose')); gameMode=null; return; }
            renderTicTacToe();
        }
        function checkWin(b, p) { const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(l=>b[l[0]]===p&&b[l[1]]===p&&b[l[2]]===p); }

        function startBulls() {
            gameMode = 'bulls';
            let num = '';
            while(num.length<4) { let d = Math.floor(Math.random()*10); if(!num.includes(d) && !(num.length===0&&d===0)) num += d; }
            gameData.target = num; gameData.attempts = 0;
            addMessage('bot', '🐂 Быки и коровы. Угадай 4-значное число (цифры не повторяются).');
        }
        function processBulls(text) {
            if (text.length!==4 || isNaN(text)) { addMessage('bot', '⚠️ Введи 4 цифры!'); return; }
            let bulls=0, cows=0, t=gameData.target;
            for(let i=0;i<4;i++){ if(text[i]===t[i]) bulls++; else if(t.includes(text[i])) cows++; }
            gameData.attempts++;
            addMessage('bot', '🐂 Быки: '+bulls+' | 🐄 Коровы: '+cows);
            if (bulls===4) { addStat('Быки и коровы'); addAchievement('Быки и коровы'); addMessage('bot', '🎉 Угадал за '+gameData.attempts+' попыток!'); gameMode=null; }
        }

        function startSapper() {
            gameMode = 'sapper';
            const size=5, mines=4;
            let board=[], minesPos=[];
            for(let i=0;i<size*size;i++) board.push(0);
            for(let i=0;i<mines;i++){ let p; do{ p=Math.floor(Math.random()*(size*size)); }while(board[p]===-1); board[p]=-1; minesPos.push(p); }
            minesPos.forEach(p=>{ for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){ let nx=Math.floor(p%size)+dx, ny=Math.floor(p/size)+dy; if(nx>=0&&nx<size&&ny>=0&&ny<size){ let idx=ny*size+nx; if(board[idx]!==-1) board[idx]++; } } });
            gameData = { board: board, size: size, mines: mines, revealed: [], gameOver: false };
            addMessage('bot', '💣 Сапёр 5x5. Введи координаты (например: 2,3). Или "выход" чтобы выйти.');
            renderSapper();
        }
        function renderSapper() {
            let s='```\n  0 1 2 3 4\n';
            for(let y=0;y<5;y++){ s+=y+' '; for(let x=0;x<5;x++){ let idx=y*5+x; s+=gameData.revealed.includes(idx)?(gameData.board[idx]===-1?'💣':gameData.board[idx]||' '):'█'; s+=' '; } s+='\n'; } s+='```';
            addMessage('bot', s);
        }
        function processSapper(text) {
            if(text.toLowerCase()==='выход'){ gameMode=null; addMessage('bot','🚪 Выход из сапёра.'); return; }
            let parts=text.split(',').map(Number);
            if(parts.length!==2||isNaN(parts[0])||isNaN(parts[1])||parts[0]<0||parts[0]>4||parts[1]<0||parts[1]>4){ addMessage('bot','⚠️ Введи x,y через запятую (0-4).'); return; }
            let idx=parts[1]*5+parts[0];
            if(gameData.revealed.includes(idx)){ addMessage('bot','⚠️ Уже открыто!'); return; }
            if(gameData.board[idx]===-1){ playBoom(); addStat('Сапёр'); addAchievement('Сапёр'); addMessage('bot', t('boom')); gameMode=null; return; }
            gameData.revealed.push(idx);
            renderSapper();
            if(gameData.revealed.length===25-gameData.mines){ addStat('Сапёр'); addAchievement('Сапёр'); addMessage('bot','🎉 Ты выиграл!'); gameMode=null; }
        }

        // ==========================================================
        //  ПАСХАЛКИ, ТЕМЫ, ЯЗЫК
        // ==========================================================
        function triggerEasterEgg() {
            eggCount++;
            if (eggCount >= 3) { triggerStars(); addMessage('bot', '🌠 Пасхалка! Звёздопад!'); eggCount=0; }
        }

        function triggerStars() {
            const container = document.createElement('div'); container.className = 'stars-container';
            container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;';
            document.body.appendChild(container);
            for (let i=0; i<100; i++) {
                const star = document.createElement('div'); star.className = 'star';
                star.style.cssText = 'position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;';
                star.style.left = Math.random()*100 + '%';
                star.style.width = star.style.height = Math.random()*3 + 2 + 'px';
                star.style.animation = 'fall '+(Math.random()*2+2)+'s linear forwards';
                star.style.animationDelay = Math.random()*2 + 's';
                container.appendChild(star);
            }
            setTimeout(() => container.remove(), 4000);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utt = new SpeechSynthesisUtterance(text);
                utt.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
                utt.rate = 0.9;
                speechSynthesis.cancel(); speechSynthesis.speak(utt);
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('verityTheme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        let savedTheme = localStorage.getItem('verityTheme');
        if (savedTheme === 'light') document.body.classList.add('light-theme');
        else if (savedTheme === 'acid') document.body.classList.add('theme-acid');
        else if (savedTheme === 'orange') document.body.classList.add('theme-orange');
        else if (savedTheme === 'forest') document.body.classList.add('theme-forest');

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            localStorage.setItem('verityLang', currentLang);
            document.getElementById('htmlLang').lang = currentLang;
            document.getElementById('langBtn').textContent = currentLang.toUpperCase();
            document.getElementById('uiTitle').textContent = t('title');
            document.getElementById('uiSubtitle').textContent = t('sub');
            document.getElementById('uiStatus').textContent = t('status');
            document.getElementById('btnSend').textContent = t('send');
            document.getElementById('userInput').placeholder = t('placeholder');
            document.getElementById('cmdHi').textContent = t('cmdHi');
            document.getElementById('cmdGames').textContent = t('cmdGames');
            document.getElementById('cmdClear').textContent = t('cmdClear');
        }
        if (localStorage.getItem('verityLang') === 'en') toggleLang();

        // ==========================================================
        //  БАЗЫ ДАННЫХ
        // ==========================================================
        const jokes = ['😂 Почему программист бросил работу? Не понял массивы!','😂 Что говорит бит? Мне тебя не хватает!','😂 Почему хакеры не любят душ? Могут помыть!','😂 Как называют медведя без зубов? Жевательный мишка!'];
        const facts = ['🧠 У осьминогов три сердца.','🧠 Мёд никогда не портится.','🧠 Бананы — это ягоды.','🧠 Слоны не умеют прыгать.'];
        const advices = ['💡 Будь добр к себе.','💡 Цени маленькие вещи.','💡 Не сравнивай себя с другими.','💡 Практикуй благодарность.'];
        const quotes = ['📝 "Будь собой." — Оскар Уайльд','📝 "Жизнь продолжается." — Роберт Фрост','📝 "Люби то, что делаешь." — Стив Джобс','📝 "Главное — не останавливаться." — Конфуций'];

        // ==========================================================
        //  АНИМИРОВАННЫЙ ФОН
        // ==========================================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animateBg() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // ==========================================================
        //  ВОССТАНОВЛЕНИЕ НАПОМИНАНИЙ
        // ==========================================================
        function restoreReminders() {
            let now = Date.now();
            reminders.forEach(r => {
                if (!r.active) return;
                let elapsed = (now - r.createdAt) / 1000;
                let remaining = r.time - elapsed;
                if (remaining <= 0) {
                    addMessage('bot', `⏰ НАПОМИНАНИЕ (восстановлено): ${r.text}`);
                    r.active = false;
                    localStorage.setItem('verityReminders', JSON.stringify(reminders));
                } else {
                    setTimeout(() => {
                        let stillActive = reminders.find(rem => rem.id === r.id && rem.active);
                        if (stillActive) {
                            addMessage('bot', `⏰ НАПОМИНАНИЕ: ${r.text}`);
                            stillActive.active = false;
                            localStorage.setItem('verityReminders', JSON.stringify(reminders));
                        }
                    }, remaining * 1000);
                }
            });
        }
        restoreReminders();

        // ==========================================================
        //  ЗАПУСК
        // ==========================================================
        if (chatLog.length > 0) {
            chatLog.forEach(m => {
                const div = document.createElement('div');
                div.className = m.sender === 'user' ? 'message user' : 'message bot';
                div.innerHTML = (m.sender === 'bot' ? '<span class="bot-name">🤖 Verity</span>' : '') + 
                    m.text + '<span class="time">' + m.time + '</span>';
                chatBox.appendChild(div);
            });
        }
        addMessage('bot', '🚀 Привет! Я Verity. Теперь у меня есть счётчик калорий, рулетка, монетка со статистикой, список покупок и напоминалка с восстановлением!');
    </script>
