<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity - Portal with Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #131c2b;
            border: 1px solid #00ffcc;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 32px;
            text-shadow: 0 0 15px #00ffcc;
            letter-spacing: 2px;
        }
        .header p {
            color: #88aacc;
            margin-top: 5px;
        }
        .chat-box {
            background: #0a0f18;
            border: 1px solid #1f2a3a;
            border-radius: 10px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-user {
            align-self: flex-end;
            background: #1a2332;
            padding: 8px 14px;
            border-radius: 15px;
            border: 1px solid #2a3a4a;
            max-width: 75%;
            word-break: break-word;
        }
        .msg-verity {
            align-self: flex-start;
            background: transparent;
            padding: 8px 14px;
            border-radius: 15px;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            max-width: 75%;
            word-break: break-word;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            background: #0a0f18;
            border: 1px solid #1f2a3a;
            border-radius: 8px;
            color: #00ffcc;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #00ffcc;
        }
        .input-area button {
            padding: 12px 25px;
            background: #00ffcc;
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-area button:hover {
            background: #00ddbb;
            box-shadow: 0 0 15px #00ffcc;
        }
        .menu-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        .menu-btn {
            background: #1a2332;
            border: 1px solid #2a3a4a;
            color: #88aacc;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }
        .menu-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            background: #0f1824;
        }
        .game-area {
            background: #0a0f18;
            border: 1px solid #1f2a3a;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            min-height: 120px;
            display: none;
        }
        .game-area.active {
            display: block;
        }
        #rickroll-container {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        #rickroll-container.active {
            display: block;
        }
        #rickroll-canvas {
            background: #000;
            border: 2px solid #00ffcc;
            width: 100%;
            max-width: 700px;
            height: 180px;
            margin: 0 auto;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .input-area { flex-direction: column; }
            .menu-bar { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>▣ VERITY</h1>
        <p>Портал — чат, игры и магия</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="msg-verity">Verity: Добро пожаловать! Ты можешь учить меня, играть или вводить команды.</div>
        <div class="msg-system" style="color: #ff66aa; font-size: 0.8em; align-self: center;">Система: Используй /help для списка команд.</div>
    </div>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Напиши Verity..." autocomplete="off">
        <button onclick="sendMessage()">➤</button>
    </div>

    <div class="menu-bar">
        <button class="menu-btn" onclick="showGames()">🎮 Игры</button>
        <button class="menu-btn" onclick="showMagic()">🪄 Магия</button>
        <button class="menu-btn" onclick="clearChat()">🗑️ Очистить</button>
    </div>

    <div class="game-area" id="gameArea">
        <h3 style="margin-bottom:10px;">Игры Verity</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="menu-btn" onclick="loadGame('guess')">Угадай число</button>
            <button class="menu-btn" onclick="loadGame('rps')">Камень-ножницы</button>
            <button class="menu-btn" onclick="loadGame('coin')">Монетка</button>
            <button class="menu-btn" onclick="loadGame('trivia')">Викторина</button>
        </div>
        <div id="gameContent" style="margin-top:15px; border-top:1px solid #1f2a3a; padding-top:15px;">
            <p>Выбери игру выше.</p>
        </div>
    </div>

    <div id="rickroll-container">
        <h3>▶ РИКРОЛЛ</h3>
        <canvas id="rickroll-canvas" height="180"></canvas>
        <button class="menu-btn" onclick="stopRickroll()" style="margin-top:10px;">Стоп (Ctrl+C)</button>
    </div>
</div>

<script>
    // ==========================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ==========================================
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    let memory = JSON.parse(localStorage.getItem('verityMemory')) || {};

    function addMessage(sender, text) {
        const div = document.createElement('div');
        if (sender === 'system') {
            div.className = 'msg-system';
            div.textContent = text;
        } else {
            div.className = sender === 'user' ? 'msg-user' : 'msg-verity';
            div.textContent = (sender === 'user' ? 'Вы: ' : 'Verity: ') + text;
        }
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ==========================================
    //  ЧАТ И ОБУЧЕНИЕ
    // ==========================================
    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        addMessage('user', text);
        chatInput.value = '';

        const lower = text.toLowerCase();

        // ВЫХОД (БЛОКИРУЕМ ВСЁ)
        if (lower === 'выход' || lower === 'exit') {
            addMessage('verity', 'Пока! Сайт заблокирован до перезагрузки страницы.');
            chatInput.disabled = true;
            document.querySelector('.input-area button').disabled = true;
            return;
        }

        if (lower === '/help') {
            addMessage('system', 'Команды: /help, /clear, /roll, /joke, /8ball. Также: запомни вопрос = ответ.');
            return;
        }

        if (lower.startsWith('запомни')) {
            const parts = text.split('=');
            if (parts.length === 2) {
                const q = parts[0].replace(/запомни|:/gi, '').trim();
                const a = parts[1].trim();
                memory[q] = a;
                localStorage.setItem('verityMemory', JSON.stringify(memory));
                addMessage('verity', `Готово! Я запомнил: "${q}" -> "${a}"`);
            } else {
                addMessage('verity', 'Ошибка! Пиши: запомни вопрос = ответ');
            }
            return;
        }

        if (memory[text]) {
            addMessage('verity', memory[text]);
            return;
        }

        if (lower === 'привет') addMessage('verity', 'Привет! Рад видеть тебя здесь.');
        else if (lower === 'как дела') addMessage('verity', 'Отлично! А как у тебя?');
        else if (lower === 'спасибо') addMessage('verity', 'Пожалуйста!');
        else if (lower === 'ты тупой') addMessage('verity', 'Сам тупой! Я код.');
        else addMessage('verity', 'Не понял. Попробуй /help или запомни вопрос = ответ.');
    }

    function clearChat() {
        chatBox.innerHTML = '';
        addMessage('system', 'Чат очищен.');
    }

    // ==========================================
    //  ИГРЫ
    // ==========================================
    const gameArea = document.getElementById('gameArea');
    const gameContent = document.getElementById('gameContent');

    function showGames() {
        gameArea.classList.toggle('active');
    }

    function loadGame(game) {
        gameContent.innerHTML = '';
        if (game === 'guess') {
            const num = Math.floor(Math.random() * 100) + 1;
            let attempts = 0;
            gameContent.innerHTML = `
                <p>Угадай число от 1 до 100.</p>
                <input type="number" id="guessInput" placeholder="Число" style="padding:8px; background:#0a0f18; border:1px solid #1f2a3a; color:#0ff; width:80px;">
                <button class="menu-btn" onclick="checkGuess(${num})">Проверить</button>
                <p id="guessResult"></p>
            `;
            window.checkGuess = function(target) {
                const val = parseInt(document.getElementById('guessInput').value);
                const res = document.getElementById('guessResult');
                attempts++;
                if (val === target) res.innerHTML = `🎉 Угадал за ${attempts} попыток!`;
                else if (val < target) res.innerHTML = '⬆️ Больше!';
                else res.innerHTML = '⬇️ Меньше!';
            };
        } else if (game === 'rps') {
            gameContent.innerHTML = `
                <p>Камень, ножницы, бумага:</p>
                <button class="menu-btn" onclick="playRPS('камень')">✊ Камень</button>
                <button class="menu-btn" onclick="playRPS('ножницы')">✌️ Ножницы</button>
                <button class="menu-btn" onclick="playRPS('бумага')">✋ Бумага</button>
                <p id="rpsResult"></p>
            `;
            window.playRPS = function(choice) {
                const opts = ['камень', 'ножницы', 'бумага'];
                const ai = opts[Math.floor(Math.random() * 3)];
                let res = `Я выбрал: ${ai}. `;
                if (choice === ai) res += 'Ничья!';
                else if (
                    (choice === 'камень' && ai === 'ножницы') ||
                    (choice === 'ножницы' && ai === 'бумага') ||
                    (choice === 'бумага' && ai === 'камень')
                ) res += 'Ты выиграл!';
                else res += 'Я выиграл!';
                document.getElementById('rpsResult').textContent = res;
            };
        } else if (game === 'coin') {
            gameContent.innerHTML = `<button class="menu-btn" onclick="flipCoin()">🪙 Бросить монетку</button><p id="coinResult"></p>`;
            window.flipCoin = function() {
                document.getElementById('coinResult').textContent = Math.random() < 0.5 ? 'Орёл!' : 'Решка!';
            };
        } else if (game === 'trivia') {
            let score = 0;
            const questions = [
                { q: 'Столица Франции?', options: ['Лондон', 'Париж', 'Берлин'], correct: 1 },
                { q: 'Сколько 2+2?', options: ['3', '4', '5'], correct: 1 },
                { q: 'Какая планета самая большая?', options: ['Земля', 'Юпитер', 'Сатурн'], correct: 1 },
                { q: 'Кто написал "Гамлет"?', options: ['Шекспир', 'Гёте', 'Данте'], correct: 0 }
            ];
            let qi = 0;
            const renderTrivia = () => {
                if (qi >= questions.length) {
                    gameContent.innerHTML = `<h3>Викторина окончена!</h3><p>Твой счёт: ${score}/${questions.length}</p>`;
                    return;
                }
                const q = questions[qi];
                let html = `<p>${q.q}</p>`;
                q.options.forEach((opt, i) => {
                    html += `<button class="menu-btn" onclick="answerTrivia(${i})">${opt}</button> `;
                });
                html += `<p id="triviaResult"></p>`;
                gameContent.innerHTML = html;
                window.answerTrivia = function(idx) {
                    const res = document.getElementById('triviaResult');
                    if (idx === q.correct) { res.innerHTML = '✅ Верно!'; score++; }
                    else { res.innerHTML = '❌ Неверно.'; }
                    qi++;
                    setTimeout(renderTrivia, 1000);
                };
            };
            renderTrivia();
        }
    }

    // ==========================================
    //  МАГИЯ — РИКРОЛЛ
    // ==========================================
    let rickInterval = null;
    const rickContainer = document.getElementById('rickroll-container');
    const canvas = document.getElementById('rickroll-canvas');
    const ctx = canvas.getContext('2d');
    const lyrics = [
        "NEVER GONNA GIVE YOU UP",
        "NEVER GONNA LET YOU DOWN",
        "NEVER GONNA RUN AROUND",
        "AND DESERT YOU",
        "NEVER GONNA MAKE YOU CRY",
        "NEVER GONNA SAY GOODBYE",
        "NEVER GONNA TELL A LIE",
        "AND HURT YOU"
    ];

    function showMagic() {
        rickContainer.classList.toggle('active');
        if (rickContainer.classList.contains('active')) {
            startRickroll();
        } else {
            stopRickroll();
        }
    }

    function startRickroll() {
        if (rickInterval) return;
        let idx = 0, y = 20;
        rickInterval = setInterval(() => {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = '20px Courier New';
            for (let i = 0; i < lyrics.length; i++) {
                ctx.fillText(lyrics[(idx + i) % lyrics.length], 20, y + i * 25);
            }
            idx++;
        }, 300);
    }

    function stopRickroll() {
        if (rickInterval) {
            clearInterval(rickInterval);
            rickInterval = null;
        }
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ==========================================
    //  ГРУППОВОЙ ЧАТ Tawk.to
    // ==========================================
    // КОД ВСТАВЛЕН В НИЗ СТРАНИЦЫ, ПЕРЕД </body>
</script>
