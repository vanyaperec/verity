<!DOCTYPE html>
<html lang="ru" id="htmlLang">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verity AI — Финальный комбайн v3 (12 фич)</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --chat-bg: rgba(0, 0, 0, 0.3);
            --header-bg: linear-gradient(135deg, #0d0d2b, #1a1a4e);
            --border: rgba(0, 200, 255, 0.15);
            --text: #e0f0ff;
            --subtext: #88bbdd;
            --user-msg: linear-gradient(135deg, #0077ff, #0055cc);
            --bot-msg-bg: rgba(255, 255, 255, 0.06);
            --bot-msg-border: rgba(0, 200, 255, 0.15);
            --btn-border: rgba(0, 200, 255, 0.2);
            --btn-bg: rgba(0, 200, 255, 0.05);
            --btn-hover: rgba(0, 200, 255, 0.15);
            --input-border: rgba(0, 200, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.04);
            --send-btn: linear-gradient(135deg, #00ccff, #0077ff);
            --canvas-z: -1;
        }
        .theme-acid { --bg: #1a001a; --chat-bg: rgba(255, 0, 255, 0.1); --header-bg: linear-gradient(135deg, #2a002a, #4a004a); --border: rgba(255, 0, 255, 0.3); --text: #ffaaff; --subtext: #cc77cc; --user-msg: linear-gradient(135deg, #ff00ff, #aa00aa); --bot-msg-bg: rgba(255, 0, 255, 0.05); --bot-msg-border: rgba(255, 0, 255, 0.3); --btn-border: rgba(255, 0, 255, 0.3); --btn-bg: rgba(255, 0, 255, 0.1); --btn-hover: rgba(255, 0, 255, 0.25); --input-border: rgba(255, 0, 255, 0.3); --input-bg: rgba(0, 0, 0, 0.2); --send-btn: linear-gradient(135deg, #ff00ff, #aa00aa); }
        .theme-orange { --bg: #1a0f00; --chat-bg: rgba(255, 100, 0, 0.1); --header-bg: linear-gradient(135deg, #2a1a00, #4a2a00); --border: rgba(255, 100, 0, 0.3); --text: #ffcc88; --subtext: #cc9944; --user-msg: linear-gradient(135deg, #ff8800, #cc5500); --bot-msg-bg: rgba(255, 100, 0, 0.05); --bot-msg-border: rgba(255, 100, 0, 0.3); --btn-border: rgba(255, 100, 0, 0.3); --btn-bg: rgba(255, 100, 0, 0.1); --btn-hover: rgba(255, 100, 0, 0.25); --input-border: rgba(255, 100, 0, 0.3); --input-bg: rgba(0, 0, 0, 0.2); --send-btn: linear-gradient(135deg, #ff8800, #cc5500); }
        .theme-forest { --bg: #001a0a; --chat-bg: rgba(0, 255, 100, 0.1); --header-bg: linear-gradient(135deg, #002a1a, #004a2a); --border: rgba(0, 255, 100, 0.3); --text: #88ffcc; --subtext: #44cc88; --user-msg: linear-gradient(135deg, #00ff88, #00cc55); --bot-msg-bg: rgba(0, 255, 100, 0.05); --bot-msg-border: rgba(0, 255, 100, 0.3); --btn-border: rgba(0, 255, 100, 0.3); --btn-bg: rgba(0, 255, 100, 0.1); --btn-hover: rgba(0, 255, 100, 0.25); --input-border: rgba(0, 255, 100, 0.3); --input-bg: rgba(0, 0, 0, 0.2); --send-btn: linear-gradient(135deg, #00ff88, #00cc55); }
        .light-theme { --bg: #f0f4f8; --chat-bg: rgba(255, 255, 255, 0.7); --header-bg: linear-gradient(135deg, #ffffff, #e0e8f0); --border: rgba(0, 0, 0, 0.15); --text: #1a1a2e; --subtext: #445566; --user-msg: linear-gradient(135deg, #0077ff, #0055cc); --bot-msg-bg: rgba(0, 0, 0, 0.04); --bot-msg-border: rgba(0, 0, 0, 0.1); --btn-border: rgba(0, 0, 0, 0.2); --btn-bg: rgba(0, 0, 0, 0.04); --btn-hover: rgba(0, 0, 0, 0.1); --input-border: rgba(0, 0, 0, 0.2); --input-bg: #ffffff; --send-btn: linear-gradient(135deg, #0077ff, #0055cc); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: background 0.4s; }
        #bgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: var(--canvas-z); pointer-events: none; opacity: 0.4; }
        .chat-container { width: 100%; max-width: 750px; background: var(--chat-bg); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; height: 92vh; max-height: 800px; backdrop-filter: blur(6px); z-index: 10; position: relative; }
        .header { background: var(--header-bg); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #0077ff); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; box-shadow: 0 0 20px rgba(0,200,255,0.3); cursor: pointer; }
        .header .info { flex: 1; min-width: 120px; }
        .header .info h1 { font-size: 18px; color: var(--text); font-weight: 600; }
        .header .info p { font-size: 12px; color: var(--subtext); }
        .status { font-size: 11px; color: #66dd88; padding: 3px 12px; border-radius: 20px; border: 1px solid rgba(0,255,100,0.2); background: rgba(0,255,100,0.12); white-space: nowrap; }
        .header-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .theme-toggle, .lang-toggle, .mic-toggle { font-size: 16px; cursor: pointer; background: none; border: none; color: var(--text); padding: 4px 6px; border-radius: 8px; transition: 0.2s; }
        .theme-toggle:hover, .lang-toggle:hover, .mic-toggle:hover { background: var(--btn-bg); }
        .mic-toggle.recording { color: #ff4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .chat-box { flex: 1; padding: 16px 20px; overflow-y: auto; background: rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.3); border-radius: 10px; }
        .message { padding: 10px 16px; border-radius: 14px; max-width: 88%; word-wrap: break-word; line-height: 1.45; font-size: 14px; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
        .message.bot { align-self: flex-start; background: var(--bot-msg-bg); color: var(--text); border: 1px solid var(--bot-msg-border); border-bottom-left-radius: 4px; }
        .message.bot .bot-name { font-size: 11px; color: #66ccff; font-weight: 600; margin-bottom: 3px; display: block; }
        .message .time { font-size: 9px; opacity: 0.4; margin-top: 4px; display: block; text-align: right; }
        .message .tag { display: inline-block; font-size: 10px; background: rgba(0,200,255,0.2); padding: 1px 8px; border-radius: 12px; margin: 2px 4px 2px 0; color: var(--subtext); }

        .input-area { padding: 12px 16px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
        .input-area input { flex: 1; padding: 10px 16px; border: 2px solid var(--input-border); border-radius: 30px; background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; transition: 0.3s; min-width: 120px; }
        .input-area input:focus { border-color: #00ccff; box-shadow: 0 0 20px rgba(0,200,255,0.1); }
        .input-area input::placeholder { color: var(--subtext); }
        .input-area button { padding: 10px 24px; border: none; border-radius: 30px; background: var(--send-btn); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; white-space: nowrap; }
        .input-area button:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(0,200,255,0.3); }

        .quick-commands { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px 12px 16px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--border); justify-content: center; flex-shrink: 0; }
        .quick-commands button { padding: 4px 14px; border: 1px solid var(--btn-border); border-radius: 20px; background: var(--btn-bg); color: var(--subtext); font-size: 11px; cursor: pointer; transition: 0.3s; }
        .quick-commands button:hover { background: var(--btn-hover); border-color: #00ccff; color: var(--text); transform: translateY(-1px); }

        .feature-grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px 10px 16px; justify-content: center; background: rgba(0,0,0,0.05); border-top: 1px solid var(--border); flex-shrink: 0; }
        .feature-grid button { padding: 3px 12px; font-size: 10px; border-radius: 14px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--subtext); cursor: pointer; transition: 0.2s; }
        .feature-grid button:hover { background: var(--btn-hover); color: var(--text); }

        #videoUpload, #audioUpload { display: none; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin: 6px 0; }
        .calendar-grid .day { padding: 4px; text-align: center; font-size: 12px; border-radius: 4px; background: rgba(255,255,255,0.05); }
        .calendar-grid .day.has-event { background: rgba(0,200,255,0.25); font-weight: bold; }
        .habit-tracker { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
        .habit-item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 4px 12px; border-radius: 20px; font-size: 13px; }

        @media (max-width: 500px) {
            .chat-container { height: 96vh; max-height: none; border-radius: 14px; }
            .chat-box { padding: 12px 14px; }
            .message { max-width: 94%; font-size: 13px; padding: 8px 12px; }
            .quick-commands { gap: 4px; padding: 4px 10px 10px 10px; }
            .quick-commands button { font-size: 10px; padding: 3px 10px; }
            .feature-grid button { font-size: 9px; padding: 2px 10px; }
            .header { padding: 10px 14px; }
            .header .info h1 { font-size: 16px; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="chat-container">
        <div class="header">
            <div class="avatar" id="avatarBtn" onclick="triggerEasterEgg()">V</div>
            <div class="info"><h1 id="uiTitle">Verity AI</h1><p id="uiSubtitle">Твой ИИ-помощник</p></div>
            <div class="status">● <span id="uiStatus">онлайн</span></div>
            <div class="header-controls">
                <button class="mic-toggle" id="micBtn" onclick="toggleMic()" title="Голосовой ввод">🎤</button>
                <button class="lang-toggle" onclick="toggleLang()" id="langBtn">RU</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            </div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="feature-grid" id="featureGrid">
            <button onclick="sendCommand('календарь')">📅 Календарь</button>
            <button onclick="sendCommand('привычки')">✅ Трекер</button>
            <button onclick="sendCommand('градиент')">🎨 Градиент</button>
            <button onclick="sendCommand('мелодия')">🎵 Мелодия</button>
            <button onclick="sendCommand('компас')">🧭 Компас</button>
            <button onclick="sendCommand('теги')">🏷️ Теги</button>
            <button onclick="sendCommand('поиск заметок текст')">🔍 Поиск</button>
        </div>
        <div class="quick-commands">
            <button onclick="sendCommand('привет')">👋 Привет</button>
            <button onclick="sendCommand('погода москва')">🌤 Погода</button>
            <button onclick="sendCommand('игры')">🎮 Игры</button>
            <button onclick="sendCommand('пароль 12')">🔑 Пароль</button>
            <button onclick="sendCommand('курс usd')">💵 Курс</button>
            <button onclick="sendCommand('заметки')">📒 Заметки</button>
            <button onclick="sendCommand('калории')">📊 Калории</button>
            <button onclick="sendCommand('монетка')">🪙 Монетка</button>
            <button onclick="sendCommand('список')">📋 Список</button>
            <button onclick="sendCommand('очистить')">🗑 Очистить</button>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Напиши что-нибудь..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" id="btnSend">➤ Отправить</button>
        </div>
    </div>

    <script>
        // =============================================================
        //  ЯДРО — ВСЕ 12 НОВЫХ ФИЧ ИНТЕГРИРОВАНЫ
        // =============================================================
        const chatBox = document.getElementById('chatBox');
        let memory = JSON.parse(localStorage.getItem('verityMemory')) || {};
        let notes = JSON.parse(localStorage.getItem('verityNotes')) || [];
        let tasks = JSON.parse(localStorage.getItem('verityTasks')) || [];
        let stats = JSON.parse(localStorage.getItem('verityStats')) || {};
        let chatLog = JSON.parse(localStorage.getItem('verityChatLog')) || [];
        let userName = localStorage.getItem('verityUserName') || 'Ты';
        let gameMode = null;
        let gameData = {};
        let eggCount = 0;
        let currentLang = localStorage.getItem('verityLang') || 'ru';
        let reminders = JSON.parse(localStorage.getItem('verityReminders')) || [];
        let shoppingList = JSON.parse(localStorage.getItem('verityShoppingList')) || [];
        let habits = JSON.parse(localStorage.getItem('verityHabits')) || [];
        let events = JSON.parse(localStorage.getItem('verityEvents')) || [];
        let noteTags = JSON.parse(localStorage.getItem('verityNoteTags')) || {};
        let melodyCache = {};

        // =============================================================
        //  ЛОКАЛИЗАЦИЯ (расширена)
        // =============================================================
        const LANG = {
            ru: {
                hi: 'Привет, {name}! Как дела?', sub: 'Твой ИИ-помощник', status: 'онлайн', send: 'Отправить',
                placeholder: 'Напиши что-нибудь...', title: 'Verity AI',
                unknown: '🤔 Не понимаю. Попробуй "помощь" или научи меня "запомни вопрос = ответ".',
                exit: '🚪 Пока! Страница заблокирована.', forget: '🧹 Я всё забыл. Мой разум чист.',
                export_done: '📥 История скачана!', theme_sw: '🎨 Тема переключена!',
                games_menu: '🎮 **Меню игр:**\n1. Угадай число (guess)\n2. Камень-ножницы-бумага (rps)\n3. Викторина (trivia)\n4. Крестики-нолики (tictactoe)\n5. Быки и коровы (bulls)\n6. Сапёр 5x5 (sapper)\n\nВведи название игры или выбери цифру.',
                guess_start: '🎲 Я загадал число от 1 до 100. Попробуй угадать!',
                rps_start: '✊ Камень, ножницы или бумага? Введи: камень, ножницы, бумага',
                trivia_start: '🎯 Викторина! Отвечай буквой a/b/c или "выход".',
                win: '🏆 Ты выиграл!', lose: '💻 Я выиграл!', draw: 'Ничья!', boom: '💥 Ты наступил на мину! Конец игры.',
                ach_menu: '🏆 **Твои достижения:**\n'
            },
            en: {
                hi: 'Hello, {name}! How are you?', sub: 'Your AI assistant', status: 'online', send: 'Send',
                placeholder: 'Type something...', title: 'Verity AI',
                unknown: '🤔 I don\'t understand. Try "help" or teach me "remember question = answer".',
                exit: '🚪 Bye! Page locked.', forget: '🧹 I forgot everything. My mind is clean.',
                export_done: '📥 History downloaded!', theme_sw: '🎨 Theme toggled!',
                games_menu: '🎮 **Game Menu:**\n1. Guess Number (guess)\n2. Rock-Paper-Scissors (rps)\n3. Trivia (trivia)\n4. Tic-Tac-Toe (tictactoe)\n5. Bulls and Cows (bulls)\n6. Minesweeper 5x5 (sapper)\n\nEnter game name or number.',
                guess_start: '🎲 I guessed a number from 1 to 100. Try to guess!',
                rps_start: '✊ Rock, paper or scissors? Enter: rock, paper, scissors',
                trivia_start: '🎯 Trivia! Answer with a/b/c or "exit".',
                win: '🏆 You won!', lose: '💻 I won!', draw: 'Draw!', boom: '💥 You stepped on a mine! Game over.',
                ach_menu: '🏆 **Your achievements:**\n'
            }
        };

        function t(key, name) {
            let str = LANG[currentLang][key] || LANG['ru'][key];
            if (name && str.includes('{name}')) str = str.replace('{name}', name);
            return str;
        }

        function addMessage(sender, text, isSystem = false) {
            const div = document.createElement('div');
            if (isSystem) { div.className = 'message bot'; div.style.alignSelf = 'center'; div.style.fontSize = '0.8em'; div.style.opacity = '0.6'; div.style.textAlign = 'center'; }
            else { div.className = sender === 'user' ? 'message user' : 'message bot'; }
            if (sender === 'user' || isSystem) { div.innerHTML = text + '<span class="time">' + getTime() + '</span>'; }
            else {
                div.innerHTML = '<span class="bot-name">🤖 Verity</span>' + text + '<span class="time">' + getTime() + '</span>';
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getTime() { const n = new Date(); return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0'); }
        function playClick() { try { const audioCtx = new AudioContext(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = 800; gain.gain.value = 0.1; osc.start(); osc.stop(audioCtx.currentTime + 0.05); } catch(e) {} }

        function launchConfetti() {
            const canvas = document.createElement('canvas');
            canvas.id = 'confettiCanvas';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let particles = [];
            const colors = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0', '#00f', '#ffa500'];
            for (let i=0; i<150; i++) {
                particles.push({
                    x: Math.random()*canvas.width, y: Math.random()*canvas.height - canvas.height,
                    w: Math.random()*8+4, h: Math.random()*8+4,
                    vx: (Math.random()-0.5)*6, vy: Math.random()*6+4,
                    color: colors[Math.floor(Math.random()*colors.length)],
                    rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*10
                });
            }
            let frame = 0;
            const interval = setInterval(() => {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                let alive = false;
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.rot += p.rotSpeed;
                    if (p.y < canvas.height + 50) { alive = true; }
                    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
                    ctx.restore();
                });
                frame++;
                if (!alive || frame > 200) { clearInterval(interval); canvas.remove(); }
            }, 30);
        }

        // =============================================================
        //  ФИЧА 1: ГОЛОСОВОЙ ВВОД
        // =============================================================
        let isRecording = false;
        let recognition = null;
        function toggleMic() {
            const micBtn = document.getElementById('micBtn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                addMessage('bot', '❌ Голосовой ввод не поддерживается в этом браузере. Используй Chrome/Edge.');
                return;
            }
            if (isRecording) {
                if (recognition) recognition.stop();
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤';
                isRecording = false;
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US';
            recognition.interimResults = true;
            recognition.continuous = false;
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('userInput').value = transcript;
                if (event.results[0].isFinal) {
                    micBtn.classList.remove('recording');
                    micBtn.textContent = '🎤';
                    isRecording = false;
                    sendMessage();
                }
            };
            recognition.onerror = (e) => {
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤';
                isRecording = false;
                addMessage('bot', '❌ Ошибка распознавания: ' + e.error);
            };
            recognition.start();
            micBtn.classList.add('recording');
            micBtn.textContent = '⏺️';
            isRecording = true;
        }

        // =============================================================
        //  ОТПРАВКА СООБЩЕНИЙ
        // =============================================================
        function sendMessage() {
            const input = document.getElementById('userInput');
            let text = input.value.trim();
            if (!text) return;
            playClick();
            addMessage('user', text);
            input.value = '';
            chatLog.push({sender: 'user', text: text, time: getTime()});
            localStorage.setItem('verityChatLog', JSON.stringify(chatLog));
            processCommand(text);
        }
        function sendCommand(cmd) { document.getElementById('userInput').value = cmd; sendMessage(); }

        // =============================================================
        //  ЯДРО ОБРАБОТКИ КОМАНД (ВСЕ 12 ФИЧ)
        // =============================================================
        function processCommand(text) {
            const lower = text.toLowerCase().trim();

            // --- Выход ---
            if (lower === 'выход' || lower === 'exit') {
                addMessage('bot', t('exit'));
                document.getElementById('userInput').disabled = true;
                document.querySelector('.input-area button').disabled = true;
                return;
            }

            // --- Помощь (обновлена) ---
            if (lower === '/help' || lower === 'помощь' || lower === 'help') {
                let msg = '**📖 Доступные команды (все 12 фич):**\n' +
                    '👋 привет, шутка, факт, совет, цитата\n' +
                    '🧠 запомни вопрос = ответ, меня зовут [имя]\n' +
                    '🎮 игры, 1-6 (выбор игры)\n' +
                    '🌤 погода [город]\n💵 курс, конверт 100 usd в rub\n' +
                    '🔑 пароль [длина]\n🖼️ мем [текст]\n' +
                    '📒 заметки, заметка [текст], теги\n' +
                    '📋 задачи, задача [текст]\n⏱️ таймер [сек], напомни через\n' +
                    '🧮 кальк [выраж], ипотека [сумма] [лет] [%]\n' +
                    '🪙 монетка, кубик, страна, температура [число] C в F\n' +
                    '📊 калории, статистика, достижения\n' +
                    '📸 скриншот\n🗑 очистить, забыть всё, скачать\n' +
                    '🛡️ /admin (скрытая панель)\n\n' +
                    '✨ **НОВЫЕ ФИЧИ:**\n' +
                    '1. 🎤 Голосовой ввод (кнопка микрофона)\n' +
                    '2. ⏰ Умные напоминания: `напомни в 15:30 купить хлеб`\n' +
                    '3. 🏷️ Теги для заметок: `заметка #важное купить хлеб`\n' +
                    '4. ✅ Трекер привычек: `привычка пить воду`, `выполнил пить воду`\n' +
                    '5. 🧭 Компас: `компас` (покажет направление по азимуту)\n' +
                    '6. 🔮 Автодополнение команд (подсказки в поле ввода)\n' +
                    '7. 🎨 Генератор градиентов: `градиент #ff0000 #0000ff`\n' +
                    '8. 📅 Календарь событий: `событие 2026-08-15 День рождения`\n' +
                    '9. 🎵 Генератор мелодии: `мелодия` (случайная)\n' +
                    '10. 📋 Сортировка задач: `сортировать задачи`\n' +
                    '11. 🔍 Поиск по заметкам: `поиск заметок хлеб`\n' +
                    '12. 🧠 Викторина по категориям: `викторина история`';
                addMessage('bot', msg);
                return;
            }

            // --- Запомни ---
            if (lower.startsWith('запомни') || lower.startsWith('remember')) {
                const parts = text.split('=');
                if (parts.length===2) {
                    const q = parts[0].replace(/запомни|remember|:/gi,'').trim();
                    const a = parts[1].trim();
                    memory[q] = a;
                    localStorage.setItem('verityMemory', JSON.stringify(memory));
                    addMessage('bot', '🧠 Запомнил: "'+q+'" -> "'+a+'"');
                } else addMessage('bot', '❌ Используй: запомни вопрос = ответ');
                return;
            }

            // --- Имя ---
            if (lower.startsWith('меня зовут') || lower.startsWith('my name is')) {
                userName = text.replace(/меня зовут|my name is/i,'').trim();
                localStorage.setItem('verityUserName', userName);
                addMessage('bot', '👋 Приятно познакомиться, '+userName+'!');
                return;
            }

            // --- Очистка ---
            if (lower === 'забудь всё' || lower === 'forget all' || lower === 'забудь') {
                localStorage.removeItem('verityMemory'); localStorage.removeItem('verityUserName'); localStorage.removeItem('verityChatLog');
                memory = {}; userName = 'Ты'; chatLog = []; chatBox.innerHTML = '';
                addMessage('bot', t('forget'));
                return;
            }

            // --- Экспорт ---
            if (lower === 'скачать' || lower === 'download' || lower === 'export') {
                let content = '=== История чата Verity ===\n';
                chatLog.forEach(m => { content += '['+m.time+'] '+m.sender+': '+m.text+'\n'; });
                const blob = new Blob([content], {type: 'text/plain'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'verity_chat.txt';
                a.click(); URL.revokeObjectURL(a.href);
                addMessage('bot', t('export_done'));
                return;
            }

            // --- Достижения ---
            if (lower === 'достижения' || lower === 'achievements' || lower === 'ach') {
                let ach = JSON.parse(localStorage.getItem('verityAchievements')) || {};
                let msg = t('ach_menu');
                let has = false;
                for (let key in ach) { if (ach[key]) { msg += '✔️ ' + key + ': ' + ach[key] + '\n'; has = true; } }
                if (!has) msg += '😴 Пока нет достижений. Играй в игры!';
                addMessage('bot', msg);
                return;
            }

            // --- Статистика ---
            if (lower === 'статистика' || lower === 'stats') {
                let msg = '📊 **Статистика побед:**\n';
                let has = false;
                for (let g in stats) { msg += '🎮 ' + g + ': ' + stats[g] + ' побед\n'; has = true; }
                if (!has) msg += '😴 Пока нет статистики. Выигрывай в игры!';
                addMessage('bot', msg);
                return;
            }

            // =============================================================
            //  ФИЧА 2: УМНЫЕ НАПОМИНАНИЯ (с датой/временем)
            // =============================================================
            if (lower.startsWith('напомни в') || lower.startsWith('remind at')) {
                let parts = text.replace(/напомни в|remind at/i, '').trim().split(' ');
                let timeStr = parts[0]; // 15:30 или 2026-08-09 15:30
                let msg = parts.slice(1).join(' ');
                if (!msg) { addMessage('bot', '⏰ Пример: напомни в 15:30 купить хлеб'); return; }
                let target = new Date();
                let datePart = timeStr.split(':');
                if (datePart.length === 2) {
                    target.setHours(parseInt(datePart[0]), parseInt(datePart[1]), 0, 0);
                } else if (timeStr.includes('-')) {
                    let d = new Date(timeStr);
                    if (!isNaN(d)) target = d;
                }
                if (target <= new Date()) target.setDate(target.getDate() + 1);
                let diff = target - new Date();
                if (diff > 0) {
                    reminders.push({ text: msg, time: target.toISOString() });
                    localStorage.setItem('verityReminders', JSON.stringify(reminders));
                    addMessage('bot', `⏰ Напоминание установлено: "${msg}" на ${target.toLocaleString()}`);
                    setTimeout(() => {
                        addMessage('bot', `🔔 НАПОМИНАНИЕ: ${msg}`);
                    }, diff);
                } else {
                    addMessage('bot', '⏰ Укажи будущее время (например: 15:30 или 2026-08-09 15:30)');
                }
                return;
            }

            // --- Список напоминаний ---
            if (lower === 'напоминания' || lower === 'reminders') {
                if (reminders.length === 0) { addMessage('bot', '⏰ Нет активных напоминаний.'); return; }
                let msg = '⏰ **Активные напоминания:**\n';
                reminders.forEach((r, i) => {
                    msg += `${i+1}. ${r.text} (${new Date(r.time).toLocaleString()})\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // =============================================================
            //  ФИЧА 3: СИСТЕМА ТЕГОВ ДЛЯ ЗАМЕТОК
            // =============================================================
            if (lower.startsWith('заметка') || lower.startsWith('note')) {
                let raw = text.replace(/заметка|note/i, '').trim();
                if (!raw) { addMessage('bot', '📒 Укажи текст заметки. Пример: заметка #важное купить хлеб'); return; }
                let tags = raw.match(/#\w+/g) || [];
                let clean = raw.replace(/#\w+/g, '').trim();
                let id = Date.now();
                let noteObj = { id, text: clean, tags: tags, created: new Date().toISOString() };
                notes.push(noteObj);
                localStorage.setItem('verityNotes', JSON.stringify(notes));
                let tagStr = tags.length ? '🏷️ Теги: ' + tags.join(' ') : '';
                addMessage('bot', `📒 Заметка сохранена: "${clean}" ${tagStr}`);
                return;
            }

            // --- Показать заметки с тегами ---
            if (lower === 'заметки' || lower === 'notes') {
                if (notes.length === 0) { addMessage('bot', '📒 Заметок пока нет.'); return; }
                let msg = '📒 **Заметки:**\n';
                notes.forEach((n, i) => {
                    let tags = n.tags && n.tags.length ? ' [' + n.tags.join(' ') + ']' : '';
                    msg += `${i+1}. ${n.text} ${tags}\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // --- Фильтр по тегу ---
            if (lower.startsWith('по тегу') || lower.startsWith('tag')) {
                let tag = text.replace(/по тегу|tag/i, '').trim();
                if (!tag.startsWith('#')) tag = '#' + tag;
                let filtered = notes.filter(n => n.tags && n.tags.includes(tag));
                if (filtered.length === 0) { addMessage('bot', `🏷️ Нет заметок с тегом ${tag}`); return; }
                let msg = `🏷️ **Заметки с тегом ${tag}:**\n`;
                filtered.forEach((n, i) => { msg += `${i+1}. ${n.text}\n`; });
                addMessage('bot', msg);
                return;
            }

            // --- Удалить заметку по тегу ---
            if (lower.startsWith('удалить по тегу')) {
                let tag = text.replace(/удалить по тегу/i, '').trim();
                if (!tag.startsWith('#')) tag = '#' + tag;
                let before = notes.length;
                notes = notes.filter(n => !(n.tags && n.tags.includes(tag)));
                localStorage.setItem('verityNotes', JSON.stringify(notes));
                addMessage('bot', `🗑️ Удалено ${before - notes.length} заметок с тегом ${tag}`);
                return;
            }

            // =============================================================
            //  ФИЧА 4: ТРЕКЕР ПРИВЫЧЕК
            // =============================================================
            if (lower.startsWith('привычка') || lower.startsWith('habit')) {
                let habitName = text.replace(/привычка|habit/i, '').trim();
                if (!habitName) { addMessage('bot', '✅ Пример: привычка пить воду'); return; }
                if (!habits.find(h => h.name === habitName)) {
                    habits.push({ name: habitName, done: false, streak: 0, history: [] });
                    localStorage.setItem('verityHabits', JSON.stringify(habits));
                    addMessage('bot', `✅ Привычка добавлена: "${habitName}"`);
                } else {
                    addMessage('bot', `⚠️ Привычка "${habitName}" уже существует.`);
                }
                return;
            }

            if (lower.startsWith('выполнил') || lower.startsWith('done habit')) {
                let habitName = text.replace(/выполнил|done habit/i, '').trim();
                let habit = habits.find(h => h.name === habitName);
                if (!habit) { addMessage('bot', `❌ Привычка "${habitName}" не найдена.`); return; }
                let today = new Date().toISOString().split('T')[0];
                if (habit.history && habit.history.includes(today)) {
                    addMessage('bot', `✅ Привычка "${habitName}" уже выполнена сегодня.`);
                    return;
                }
                habit.done = true;
                if (!habit.history) habit.history = [];
                habit.history.push(today);
                habit.streak = (habit.streak || 0) + 1;
                localStorage.setItem('verityHabits', JSON.stringify(habits));
                addMessage('bot', `✅ Привычка "${habitName}" выполнена! 📈 Стрелка: ${habit.streak} дней.`);
                return;
            }

            if (lower === 'привычки' || lower === 'habits') {
                if (habits.length === 0) { addMessage('bot', '✅ Нет привычек. Добавь через "привычка пить воду"'); return; }
                let msg = '✅ **Трекер привычек:**\n';
                habits.forEach(h => {
                    let status = h.done ? '✅' : '⬜';
                    msg += `${status} ${h.name} (стрейк: ${h.streak || 0})\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // =============================================================
            //  ФИЧА 5: КОМПАС (азимут + направление)
            // =============================================================
            if (lower === 'компас' || lower === 'compass') {
                if (!navigator.geolocation) {
                    addMessage('bot', '🧭 Геолокация не поддерживается в этом браузере.');
                    return;
                }
                addMessage('bot', '🧭 Определяю направление...');
                navigator.geolocation.getCurrentPosition((pos) => {
                    let heading = pos.coords.heading;
                    if (heading === null || heading === undefined) {
                        addMessage('bot', '🧭 Устройство не поддерживает определение направления (нет компаса).');
                        return;
                    }
                    let dirs = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
                    let idx = Math.round(heading / 45) % 8;
                    addMessage('bot', `🧭 **Компас:**\n🔹 Азимут: ${heading.toFixed(1)}°\n🔹 Направление: ${dirs[idx]}`);
                }, () => {
                    addMessage('bot', '🧭 Ошибка определения местоположения. Разреши доступ к геолокации.');
                }, { enableHighAccuracy: true });
                return;
            }

            // =============================================================
            //  ФИЧА 6: АВТОДОПОЛНЕНИЕ (уже встроено через datalist в HTML, добавим динамику)
            // =============================================================
            // Реализуем через подсказки в поле ввода (datalist)
            // Добавляем datalist динамически при первом вызове
            if (!document.getElementById('cmdSuggestions')) {
                const datalist = document.createElement('datalist');
                datalist.id = 'cmdSuggestions';
                const cmds = ['привет', 'помощь', 'погода', 'курс', 'пароль', 'заметка', 'заметки', 'задача', 'задачи',
                    'калории', 'монетка', 'кубик', 'компас', 'привычка', 'привычки', 'градиент', 'мелодия', 'календарь',
                    'событие', 'викторина', 'поиск заметок', 'сортировать задачи', 'напомни в', 'таймер', 'мем', 'шутка',
                    'факт', 'совет', 'цитата', 'страна', 'температура', 'конверт', 'ипотека', 'кальк', 'очистить', 'выход'];
                cmds.forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c;
                    datalist.appendChild(opt);
                });
                document.getElementById('userInput').setAttribute('list', 'cmdSuggestions');
                document.body.appendChild(datalist);
            }

            // =============================================================
            //  ФИЧА 7: ГЕНЕРАТОР ГРАДИЕНТОВ
            // =============================================================
            if (lower.startsWith('градиент') || lower.startsWith('gradient')) {
                let parts = text.replace(/градиент|gradient/i, '').trim().split(' ');
                let c1 = parts[0] || '#0077ff';
                let c2 = parts[1] || '#00ccff';
                if (!c1.startsWith('#')) c1 = '#' + c1;
                if (!c2.startsWith('#')) c2 = '#' + c2;
                let angle = parts[2] || '135deg';
                let style = `background: linear-gradient(${angle}, ${c1}, ${c2}); padding: 20px; border-radius: 16px; color: #fff; text-align: center;`;
                let html = `<div style="${style}"><strong>🎨 Градиент</strong><br>${c1} → ${c2}<br><span style="font-size:12px;">${angle}</span></div>`;
                addMessage('bot', html);
                // Также генерируем CSS-код
                let css = `background: linear-gradient(${angle}, ${c1}, ${c2});`;
                addMessage('bot', `📐 CSS-код:\n\`${css}\``);
                return;
            }

            // =============================================================
            //  ФИЧА 8: КАЛЕНДАРЬ СОБЫТИЙ
            // =============================================================
            if (lower.startsWith('событие') || lower.startsWith('event')) {
                let parts = text.replace(/событие|event/i, '').trim().split(' ');
                let dateStr = parts[0];
                let desc = parts.slice(1).join(' ');
                if (!dateStr || !desc) { addMessage('bot', '📅 Пример: событие 2026-08-15 День рождения'); return; }
                let d = new Date(dateStr);
                if (isNaN(d)) { addMessage('bot', '📅 Неверный формат даты. Используй ГГГГ-ММ-ДД'); return; }
                events.push({ date: dateStr, desc: desc, id: Date.now() });
                localStorage.setItem('verityEvents', JSON.stringify(events));
                addMessage('bot', `📅 Событие добавлено: ${dateStr} — ${desc}`);
                return;
            }

            if (lower === 'календарь' || lower === 'calendar') {
                if (events.length === 0) { addMessage('bot', '📅 Нет событий. Добавь через "событие 2026-08-15 День рождения"'); return; }
                let msg = '📅 **Календарь событий:**\n';
                let sorted = [...events].sort((a,b) => a.date.localeCompare(b.date));
                sorted.forEach(e => {
                    msg += `📌 ${e.date} — ${e.desc}\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // --- Показать события на сегодня ---
            if (lower === 'события сегодня' || lower === 'today events') {
                let today = new Date().toISOString().split('T')[0];
                let todayEvents = events.filter(e => e.date === today);
                if (todayEvents.length === 0) { addMessage('bot', '📅 Сегодня нет событий.'); return; }
                let msg = '📅 **События на сегодня:**\n';
                todayEvents.forEach(e => { msg += `📌 ${e.desc}\n`; });
                addMessage('bot', msg);
                return;
            }

            // =============================================================
            //  ФИЧА 9: ГЕНЕРАТОР МЕЛОДИИ (синтез через Web Audio)
            // =============================================================
            if (lower === 'мелодия' || lower === 'melody') {
                try {
                    const audioCtx = new AudioContext();
                    const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
                    let sequence = [];
                    for (let i = 0; i < 16; i++) {
                        sequence.push(notes[Math.floor(Math.random() * notes.length)]);
                    }
                    let time = audioCtx.currentTime;
                    sequence.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.value = 0.15;
                        osc.start(time + i * 0.15);
                        osc.stop(time + i * 0.15 + 0.12);
                    });
                    addMessage('bot', '🎵 Генерация мелодии... Слушай! (8 нот)');
                } catch(e) {
                    addMessage('bot', '🎵 Ошибка генерации мелодии. Попробуй в Chrome.');
                }
                return;
            }

            // =============================================================
            //  ФИЧА 10: СОРТИРОВКА ЗАДАЧ
            // =============================================================
            if (lower === 'сортировать задачи' || lower === 'sort tasks') {
                if (tasks.length === 0) { addMessage('bot', '📋 Нет задач для сортировки.'); return; }
                let sorted = [...tasks].sort((a,b) => {
                    if (a.done && !b.done) return 1;
                    if (!a.done && b.done) return -1;
                    return a.text.localeCompare(b.text);
                });
                tasks = sorted;
                localStorage.setItem('verityTasks', JSON.stringify(tasks));
                let msg = '📋 **Задачи отсортированы (выполненные внизу):**\n';
                tasks.forEach((t, i) => {
                    msg += `${i+1}. ${t.text} [${t.done ? '✅' : '⬜'}]\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // =============================================================
            //  ФИЧА 11: ПОИСК ПО ЗАМЕТКАМ
            // =============================================================
            if (lower.startsWith('поиск заметок') || lower.startsWith('search notes')) {
                let query = text.replace(/поиск заметок|search notes/i, '').trim();
                if (!query) { addMessage('bot', '🔍 Пример: поиск заметок хлеб'); return; }
                let results = notes.filter(n => n.text.toLowerCase().includes(query.toLowerCase()));
                if (results.length === 0) { addMessage('bot', `🔍 Ничего не найдено по запросу "${query}"`); return; }
                let msg = `🔍 **Результаты поиска (${results.length}):**\n`;
                results.forEach((n, i) => {
                    let tags = n.tags && n.tags.length ? ' [' + n.tags.join(' ') + ']' : '';
                    msg += `${i+1}. ${n.text} ${tags}\n`;
                });
                addMessage('bot', msg);
                return;
            }

            // =============================================================
            //  ФИЧА 12: ВИКТОРИНА ПО КАТЕГОРИЯМ
            // =============================================================
            if (lower.startsWith('викторина') || lower.startsWith('trivia category')) {
                let category = text.replace(/викторина|trivia category/i, '').trim() || 'общая';
                const categories = {
                    'история': [
                        { q: 'В каком году началась Вторая мировая война?', o: ['a) 1939', 'b) 1941', 'c) 1945'], a: 'a' },
                        { q: 'Кто был первым президентом США?', o: ['a) Линкольн', 'b) Вашингтон', 'c) Джефферсон'], a: 'b' }
                    ],
                    'наука': [
                        { q: 'Сколько планет в солнечной системе?', o: ['a) 7', 'b) 8', 'c) 9'], a: 'b' },
                        { q: 'H2O — это...?', o: ['a) Вода', 'b) Соль', 'c) Кислота'], a: 'a' }
                    ],
                    'игры': [
                        { q: 'Какая игра вышла в 2011 году?', o: ['a) Skyrim', 'b) Cyberpunk', 'c) GTA V'], a: 'a' },
                        { q: 'Кто создал Minecraft?', o: ['a) Notch', 'b) Gabe', 'c) Markus'], a: 'a' }
                    ],
                    'общая': [
                        { q: 'Столица Франции?', o: ['a) Лондон', 'b) Париж', 'c) Берлин'], a: 'b' },
                        { q: '2+2?', o: ['a) 3', 'b) 4', 'c) 5'], a: 'b' }
                    ]
                };
                let qs = categories[category] || categories['общая'];
                gameMode = 'trivia';
                gameData = { score: 0, qIndex: 0, questions: qs, category: category };
                addMessage('bot', `🎯 Викторина по категории "${category}"! Отвечай буквой a/b/c или "выход".`);
                setTimeout(() => showTriviaQ(), 400);
                return;
            }

            // --- Игры (существующие) ---
            if (lower === 'игры' || lower === 'games') { addMessage('bot', t('games_menu')); return; }
            if (lower === '1' || lower === 'guess') { gameMode = 'guess'; gameData = {}; addMessage('bot', t('guess_start')); return; }
            if (lower === '2' || lower === 'rps') { gameMode = 'rps'; addMessage('bot', t('rps_start')); return; }

        function startTicTacToe() { gameMode = 'tictactoe'; gameData = { board: [' ',' ',' ',' ',' ',' ',' ',' ',' '], turn: 'X' }; addMessage('bot', '⭕ Крестики-нолики. Введи номер клетки (1-9).'); renderTicTacToe(); }
        function renderTicTacToe() { const b = gameData.board; let s=''; for(let i=0;i<9;i++){ s += (i%3===0?'\n':'') + (b[i]===' '?i+1:b[i]) + ' '; } addMessage('bot', '```\n'+s+'\n```'); }
        function processTicTacToe(text) {
            const idx = parseInt(text)-1;
            if (isNaN(idx)||idx<0||idx>8||gameData.board[idx]!==' ') { addMessage('bot','⚠️ Неверно'); return; }
            gameData.board[idx]='X';
            if (checkWin(gameData.board,'X')) { addMessage('bot',t('win')); gameMode=null; return; }
            let empty=gameData.board.map((v,i)=>v===' '?i:null).filter(v=>v!==null);
            if(!empty.length){ addMessage('bot',t('draw')); gameMode=null; return; }
            let move=empty[Math.floor(Math.random()*empty.length)];
            gameData.board[move]='O';
            if (checkWin(gameData.board,'O')) { addMessage('bot',t('lose')); gameMode=null; return; }
            renderTicTacToe();
        }
        function checkWin(b,p){ const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]; return w.some(l=>b[l[0]]===p&&b[l[1]]===p&&b[l[2]]===p); }

        function startBulls() { gameMode='bulls'; let num=''; while(num.length<4){let d=Math.floor(Math.random()*10); if(!num.includes(d)&&!(num.length===0&&d===0)) num+=d;} gameData.target=num; gameData.attempts=0; addMessage('bot','🐂 Быки и коровы. Угадай 4-значное число.'); }
        function processBulls(text) {
            if(text.length!==4||isNaN(text)){ addMessage('bot','⚠️ 4 цифры!'); return; }
            let bulls=0,cows=0,t=gameData.target;
            for(let i=0;i<4;i++){ if(text[i]===t[i]) bulls++; else if(t.includes(text[i])) cows++; }
            gameData.attempts++;
            addMessage('bot',`🐂 Быки: ${bulls} | 🐄 Коровы: ${cows}`);
            if(bulls===4){ addMessage('bot',`🎉 Угадал за ${gameData.attempts} попыток!`); gameMode=null; }
        }

        function startSapper() {
            gameMode='sapper'; const size=5,mines=4;
            let board=[], minesPos=[];
            for(let i=0;i<size*size;i++) board.push(0);
            for(let i=0;i<mines;i++){ let p; do{ p=Math.floor(Math.random()*(size*size)); }while(board[p]===-1); board[p]=-1; minesPos.push(p); }
            minesPos.forEach(p=>{ for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){ let nx=Math.floor(p%size)+dx, ny=Math.floor(p/size)+dy; if(nx>=0&&nx<size&&ny>=0&&ny<size){ let idx=ny*size+nx; if(board[idx]!==-1) board[idx]++; } } });
            gameData = { board, size, mines, revealed: [], gameOver: false };
            addMessage('bot','💣 Сапёр 5x5. Введи координаты (2,3).');
            renderSapper();
        }
        function renderSapper() {
            let s='```\n  0 1 2 3 4\n';
            for(let y=0;y<5;y++){ s+=y+' '; for(let x=0;x<5;x++){ let idx=y*5+x; s+=gameData.revealed.includes(idx)?(gameData.board[idx]===-1?'💣':gameData.board[idx]||' '):'█'; s+=' '; } s+='\n'; } s+='```';
            addMessage('bot', s);
        }
        function processSapper(text) {
            if(text.toLowerCase()==='выход'){ gameMode=null; addMessage('bot','🚪 Выход.'); return; }
            let parts=text.split(',').map(Number);
            if(parts.length!==2||isNaN(parts[0])||isNaN(parts[1])||parts[0]<0||parts[0]>4||parts[1]<0||parts[1]>4){ addMessage('bot','⚠️ x,y (0-4)'); return; }
            let idx=parts[1]*5+parts[0];
            if(gameData.revealed.includes(idx)){ addMessage('bot','⚠️ Уже открыто'); return; }
            if(gameData.board[idx]===-1){ addMessage('bot',t('boom')); gameMode=null; return; }
            gameData.revealed.push(idx);
            renderSapper();
            if(gameData.revealed.length===25-gameData.mines){ addMessage('bot','🎉 Выиграл!'); gameMode=null; }
        }

        processCommand = function(text) {
            const lower = text.toLowerCase().trim();
            if (gameMode === 'trivia' && lower !== 'выход' && lower !== 'exit') {
                const q = gameData.questions[gameData.qIndex];
                if (q && lower === q.a) { gameData.score++; addMessage('bot', '✅ Верно!'); }
                else if (q) addMessage('bot', '❌ Неверно. Ответ: '+q.a.toUpperCase());
                gameData.qIndex++;
                setTimeout(showTriviaQ, 600);
                return;
            }
            if (gameMode === 'tictactoe') { processTicTacToe(text); return; }
            if (gameMode === 'bulls') { processBulls(text); return; }
            if (gameMode === 'sapper') { processSapper(text); return; }
            if (gameMode === 'rps') {
                const rpsMap = { 'камень': 'камень', 'ножницы': 'ножницы', 'бумага': 'бумага', 'rock': 'камень', 'paper': 'бумага', 'scissors': 'ножницы' };
                let player = rpsMap[lower];
                if (!player) { addMessage('bot', '✊ Введи: камень, ножницы или бумага'); return; }
                const choices = ['камень','ножницы','бумага'];
                const botChoice = choices[Math.floor(Math.random()*3)];
                if (player === botChoice) { addMessage('bot', `🤝 Ничья! Я тоже ${botChoice}`); }
                else if ((player==='камень'&&botChoice==='ножницы')||(player==='ножницы'&&botChoice==='бумага')||(player==='бумага'&&botChoice==='камень')) {
                    addMessage('bot', `🎉 Ты выиграл! ${player} побеждает ${botChoice}`);
                } else {
                    addMessage('bot', `💻 Я выиграл! ${botChoice} побеждает ${player}`);
                }
                gameMode = null;
                return;
            }
            if (gameMode === 'guess') {
                if (!gameData.number) gameData.number = Math.floor(Math.random()*100)+1;
                let guess = parseInt(text);
                if (isNaN(guess)) { addMessage('bot', '🔢 Введи число!'); return; }
                if (guess === gameData.number) { addMessage('bot', `🎉 Угадал! Это было ${gameData.number}`); gameMode = null; return; }
                addMessage('bot', guess < gameData.number ? '📈 Больше!' : '📉 Меньше!');
                return;
            }
            originalProcess(text);
        };

        // =============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // =============================================================
        // --- Тема ---
        let savedTheme = localStorage.getItem('verityTheme');
        if (savedTheme === 'light') document.body.classList.add('light-theme');
        else if (savedTheme === 'acid') document.body.classList.add('theme-acid');
        else if (savedTheme === 'orange') document.body.classList.add('theme-orange');
        else if (savedTheme === 'forest') document.body.classList.add('theme-forest');

        // --- Язык ---
        if (localStorage.getItem('verityLang') === 'en') toggleLang();

        // --- Анимированный фон ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * width; this.y = Math.random() * height; this.size = Math.random() * 2 + 0.5; this.speedX = (Math.random() - 0.5) * 0.3; this.speedY = (Math.random() - 0.5) * 0.3; this.opacity = Math.random() * 0.5 + 0.2; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset(); }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,255,255,${this.opacity})`; ctx.fill(); }
        }
        for (let i = 0; i < 80; i++) particles.push(new Particle());
        function animateBg() { ctx.clearRect(0,0,width,height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateBg); }
        animateBg();

        // --- Восстановление чата ---
        if (chatLog.length > 0) {
            chatLog.forEach(m => {
                const div = document.createElement('div');
                div.className = m.sender === 'user' ? 'message user' : 'message bot';
                div.innerHTML = (m.sender === 'bot' ? '<span class="bot-name">🤖 Verity</span>' : '') + 
                    m.text + '<span class="time">' + m.time + '</span>';
                chatBox.appendChild(div);
            });
        }
        if (chatBox.children.length === 0) {
            addMessage('bot', '🚀 Verity v3 готов! Все 12 фич внутри: голос, умные напоминания, теги, привычки, компас, градиенты, календарь, мелодии, сортировка, поиск, викторина, автодополнение. Напиши "помощь"!');
        }

        // --- Пасхалка на аватар ---
        function triggerEasterEgg() { eggCount++; if (eggCount >= 3) { launchConfetti(); addMessage('bot', '🌠 Звёздопад!'); eggCount=0; } }
        function speakText(text) { if ('speechSynthesis' in window) { const utt = new SpeechSynthesisUtterance(text); utt.lang = currentLang === 'ru' ? 'ru-RU' : 'en-US'; utt.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(utt); } }

        // --- Подключение html2canvas для скриншотов ---
        const script = document.createElement('script');
        script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
        document.head.appendChild(script);
    </script>
</body>
